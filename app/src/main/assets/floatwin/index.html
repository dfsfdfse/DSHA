<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCHA</title>
<style>
  /* 令牌数值对齐 dsh：ui-theme/src/styles/design-platform.css + base.css */
  :root {
    --bg-rgb: 255, 255, 255;
    --alpha: .97;
    --fg: rgb(15, 17, 21);            /* --dsw-alias-label-primary */
    --muted: rgb(97, 102, 107);        /* --dsw-alias-label-secondary */
    --tertiary: rgb(129, 133, 140);    /* --dsw-alias-label-tertiary */
    --caption: rgb(173, 178, 184);     /* --dsw-alias-label-caption */
    --line: rgba(0, 0, 0, .10);        /* --dsw-alias-border-l2 */
    --line-soft: rgba(0, 0, 0, .04);   /* --dsw-alias-border-l1 */
    --line-strong: rgba(0, 0, 0, .12); /* --dsw-alias-border-l3 */
    --accent: rgb(65, 118, 230);       /* --dsw-alias-button-info-fill */
    --field: #fff;                     /* --dsw-specific-input-major */
    --selector: rgb(245, 246, 247);    /* --dsw-specific-selector */
    --danger: #ff6b5e;                 /* state-error */
    --ok: #46c37b;
    --hover: rgba(38, 49, 72, .06);    /* --dsw-alias-interactive-bg-hover */
    --warn: rgb(221, 134, 41);         /* --dsw-alias-state-warn-label */
    --warn-soft: rgb(247, 173, 49);    /* --dsw-alias-state-warn-secondary */
    --font: var(--dsh-font, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
      Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif);
    /* 悬浮窗比 dsh 的整页窄，字阶同比例收一档：13/20 正文、12 次要 */
    --fs-content: 13px;
    --lh-content: 20px;
    --fs-secondary: 12px;
    /* 上下文分段色：system=bluish-400 / tools=violet-400 / messages=blue-450 */
    --meter-sys: rgb(173, 178, 184);
    --meter-tools: rgb(167, 139, 250);
    --meter-msg: rgb(77, 147, 248);
  }
  body.dark {
    --bg-rgb: 22, 25, 31;
    --fg: rgb(249, 250, 251);
    --muted: rgb(207, 211, 214);
    --tertiary: rgb(173, 178, 184);
    --caption: rgb(129, 133, 140);
    --line: rgba(255, 255, 255, .12);
    --line-soft: rgba(255, 255, 255, .06);
    --line-strong: rgba(255, 255, 255, .16);
    --accent: rgb(122, 170, 255);
    --field: rgb(44, 44, 46);
    --selector: rgb(53, 54, 56);
    --hover: rgba(255, 255, 255, .08);
  }
  /* 深色只需要补那些没有 token 的地方；窗口/卡片/按钮的颜色都由变量决定 */
  body.dark .thumb, body.dark .file-chip { background: var(--selector); }
  body.dark .msg-body code, body.dark .msg-body .path {
    background: rgba(255,255,255,.08); color: rgb(216,222,232);
  }
  body.dark .msg-body .url { background: rgba(111,155,255,.14); color: rgb(143,178,255); }
  body.dark #usage-card { background: var(--field); }
  body.dark .empty-state span { color: rgba(242,244,248,.45); }
  body.dark .empty-state .ico { background: rgba(111,155,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    /* dsh 的正文字阶：14/24，触屏输入框抬到 16px 防缩放 */
    font-family: var(--font);
    font-size: var(--fs-content);
    line-height: var(--lh-content);
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #card {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(var(--bg-rgb), var(--alpha));
    border: 0.5px solid var(--line-soft);
    border-radius: 6px;
    padding: 10px 14px 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    overflow: hidden;
  }
  /* 唯一的拖动区：与原生触摸带等高 */
  /* 头部：dsh ConversationRoot .titleRow(30) / .crumb(14/20, 4 8, radius 12) */
  #head {
    flex: 0 0 auto;
    min-height: 30px;
    display: flex; align-items: center; gap: 4px;
    overflow: hidden;
    /* 右上角有原生的 ≡ / × / ↗ 三个小按钮，标题不要钻到它们下面 */
    padding-right: 148px;
  }
  #title {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 4px 8px; border-radius: 12px;
    font-size: 13px; line-height: 18px; font-weight: 500;
    color: var(--fg);
  }
  #live, #count {
    flex: none; font-size: 12px; line-height: 18px; color: var(--tertiary);
  }
  #head .headspacer { flex: 1 1 auto; min-width: 0; }
  #perm-head {
    flex: 0 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 4px;
    height: 22px; padding: 0 4px; border: none; border-radius: 6px;
    background: transparent; color: var(--muted); font-family: inherit; font-size: 12px;
  }
  #perm-head[hidden] { display: none; }
  #perm-head .pglyph { display: inline-flex; flex: none; }
  #perm-head .pglyph svg { width: 13px; height: 13px; }
  #perm-head .name { display: none; }
  #perm-head .chev { width: 10px; height: 10px; color: var(--caption); flex: none; }
  .viewswitch {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    padding-bottom: 6px;
  }
  .viewswitch button {
    border: none; background: transparent; padding: 0; color: var(--tertiary);
    font-family: inherit; font-size: 12px; line-height: 20px;
  }
  .viewswitch button.on { color: var(--fg); font-weight: 500; }
  #folder {
    flex: none; width: 24px; height: 22px; padding: 0; border: none; border-radius: 6px;
    background: transparent; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  #folder svg { width: 15px; height: 15px; }
  #head #meter { height: 22px; padding: 0 6px; gap: 4px; font-size: 12px; }
  #head #meter svg.chev { width: 10px; height: 10px; color: var(--caption); }
  #dot { width: 6px; height: 6px; background: var(--accent); flex: 0 0 auto; }
  body.busy #dot { animation: fw-pulse 1.3s ease-in-out infinite; }
  @keyframes fw-pulse { 0%,100% { opacity: 1 } 50% { opacity: .28 } }
  #live { flex: 0 0 auto; font-size: 10px; color: var(--accent); }
  #live[hidden] { display: none; }
  #title {
    font-size: 11.5px; color: var(--muted); flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #count {
    font-size: 10px; color: var(--muted); flex: 0 0 auto;
    border-left: 1px solid var(--line); padding-left: 6px;
  }
  #count[hidden] { display: none; }

  #tabrow[hidden] { display: none; }
  #tabrow {
    flex: 0 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    margin: 2px 0 4px;
    border-bottom: 0.5px solid var(--line-soft);
  }
  #tabs {
    flex: 1 1 auto; min-width: 0;
    display: flex; gap: 16px; overflow-x: auto; overflow-y: hidden;
    padding-bottom: 0;
    scrollbar-width: none;
  }
  #tabs[hidden] { display: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs[hidden] { display: none; }
  .tab.live::after {
    content: ''; display: inline-block; width: 4px; height: 4px; border-radius: 2px;
    background: var(--accent); margin-left: 4px; vertical-align: 1px;
  }
  /* 会话标签：dsh 的工具栏控件不带描边，只有悬停/选中底色 */
  .tab {
    position: relative;
    flex: 0 0 auto; max-width: 160px;
    font-size: 13px; line-height: 20px; color: var(--tertiary);
    background: transparent; border: none; border-radius: 0;
    padding: 2px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }

  /* 消息列表：填满剩余高度并滚动，样式对齐聊天记录 */
  #list {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    border-top: 0.5px solid var(--line-soft); margin-top: 2px;
    /* 底边渐隐：滚到边界时文字是淡出，不是被硬切一半（dsh 的聊天滚动区同款） */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent 100%);
  }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); }
  #list::-webkit-scrollbar-track { background: transparent; }
  .empty { color: var(--muted); font-size: 12px; padding: 10px 0; }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; height: 100%; min-height: 160px; color: var(--muted); text-align: center;
  }
  .empty-state b { font-size: 13px; font-weight: 500; color: var(--fg); }
  .empty-state span { font-size: 11.5px; line-height: 1.6; color: rgba(23,24,28,.45); }
  .empty-state .ico { width: 34px; height: 34px; border-radius: 6px;
    background: var(--hover); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .empty-state .ico svg { width: 18px; height: 18px; stroke: var(--accent); fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .working { display: flex; align-items: center; gap: 7px; padding: 9px 2px 3px; color: var(--muted); font-size: 11.5px; }
  .working .dots { display: inline-flex; gap: 3px; }
  .working .dots i { width: 4px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .35;
    animation: fw-dot 1.1s ease-in-out infinite; }
  .working .dots i:nth-child(2) { animation-delay: .18s; }
  .working .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes fw-dot { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

  .msg { border-bottom: 1px solid rgba(0,0,0,.06); }
  .msg:last-child { border-bottom: none; }
  .msg-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 0 7px 2px; cursor: pointer;
  }
  .badge {
    flex: 0 0 auto; width: 4px; height: 4px; margin-top: 7px;
    background: var(--accent);
  }
  .msg.tool .badge { background: var(--warn-soft); }
  /* dsh 的提问是右对齐气泡：max-width 82%、圆角 12、selector 底 */
  .msg.user {
    margin-left: 18%; width: auto; max-width: 82%;
    background: var(--selector); border-radius: 12px;
    border-bottom: none; padding: 4px 12px 0;
  }
  .msg.user .msg-head { display: none; }
  .msg.user .msg-body { padding: 8px 0; -webkit-line-clamp: 6; }
  .msg.user .msg-title { color: var(--fg); font-weight: 500; }
  body.dark .msg.user { background: rgba(111,155,255,.10); }
  .msg-title {
    flex: 1 1 auto; min-width: 0;
    font-size: var(--fs-secondary); line-height: 18px; color: var(--fg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .msg.open .msg-title { -webkit-line-clamp: unset; display: block; }
  .msg-chev { flex: 0 0 auto; width: 12px; height: 12px; margin-top: 3px; color: var(--muted);
    transition: transform .15s ease; }
  .msg-chev svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .msg.open .msg-chev { transform: rotate(180deg); }
  .msg-time {
    flex: 0 0 auto; align-self: flex-start; margin-top: 2px;
    font-size: 11px; color: var(--caption); font-variant-numeric: tabular-nums;
  }
  /* 正文默认就显示：dsh 那边是直接读回复，不是先看一行标题再点开 */
  .msg-body {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6;
    overflow: hidden;
    font-size: var(--fs-content); line-height: var(--lh-content); color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
    padding: 0 0 8px 12px;
  }
  .msg.user .msg-body { -webkit-line-clamp: 3; color: var(--fg); }
  .msg.tool .msg-body {
    -webkit-line-clamp: 2; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; line-height: 16px;
  }
  /* 回复/提问没有标题：标题元素留着当弹性占位，时间才靠右 */
  .msg.no-title .msg-title { display: block; -webkit-line-clamp: 1; min-height: 0; }
  /* 工具调用和思考：折叠时只有一行「标签 · 参数」，点开才看全文（和 dsh 一样） */
  .msg.tool .msg-body, .msg.think .msg-body { display: none; }
  .msg.tool.open .msg-body, .msg.think.open .msg-body { display: block; }
  .msg.process { border-bottom: 0.5px solid var(--line); }
  .msg.process .process-head {
    align-items: center; height: 33px; padding: 0 0 8px;
    color: var(--tertiary); font-size: 13px;
  }
  .msg.process .msg-title { -webkit-line-clamp: 1; color: inherit; font-size: inherit; }
  .msg.process .msg-chev { width: 14px; height: 14px; margin-left: 4px; margin-top: 0; }
  .msg.process .msg-chev svg { width: 14px; height: 14px; stroke-width: 1; }
  .msg.process.open .msg-chev { transform: rotate(180deg); }
  .process-body { display: none; padding-left: 10px; }
  .msg.process.open .process-body { display: block; }
  .process-body .msg { border-bottom: none; }
  /* 步骤行：dsh 轨迹那样「图标 + 标签 · 参数」，单行、密排 */
  .msg.step .msg-head { padding: 3px 0; align-items: center; }
  .msg.step .msg-title { -webkit-line-clamp: 1; font-size: 12.5px; line-height: 18px; }
  .msg.step .msg-time { font-size: 10.5px; margin-top: 0; }
  /* 步骤行标题里的路径/链接：dsh 是下划线，不是色块 */
  .msg-title .path, .msg-title .url {
    color: inherit; background: none; padding: 0; font-family: inherit; font-size: inherit;
    text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px;
  }
  .step-ico { flex: 0 0 14px; width: 14px; height: 14px; color: var(--tertiary); margin-top: 2px; }
  /* 工具失败的徽标：dsh 轨迹行右侧的小 pill（• 退出码 1） */
  .step-err {
    flex: none; display: inline-flex; align-items: center; gap: 4px;
    height: 18px; padding: 0 7px; border-radius: 9px;
    background: rgba(255, 107, 94, .12); color: var(--danger);
    font-size: 11px; line-height: 18px; font-variant-numeric: tabular-nums;
  }
  .step-err::before {
    content: ''; width: 4px; height: 4px; border-radius: 2px; background: var(--danger);
  }
  .step-ico svg { width: 14px; height: 14px; display: block; }
  /* 过程组里的步骤只留一行标题，正文（参数原文）不重复铺开 */
  .process-body .msg-body { display: none !important; }
  .process-body .msg.open .msg-body { display: block !important; }
  .process-body .msg-head { padding: 4px 0; }
  .msg.assistant .badge { display: none; }
  /* 轨迹视图：提问与回复压成单行，和 dsh 的轨迹一致 */
  body.trace .msg.user {
    margin-left: 0; max-width: 100%; background: transparent; border-radius: 0; padding: 0;
  }
  body.trace .msg.condensed .msg-body { display: none !important; }
  body.trace .msg.condensed .msg-title {
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 12.5px; line-height: 18px;
  }
  body.trace .msg.user .msg-head { display: flex; padding: 3px 0; }
  body.trace .msg.user .msg-title { display: -webkit-box; -webkit-line-clamp: 1; font-size: 12.5px; line-height: 18px; }
  body.trace .msg.user .msg-time { font-size: 10.5px; margin-top: 0; }
  body.trace .msg.user .msg-chev { display: none; }
  body.trace .msg.assistant .msg-head { padding: 3px 0; }
  .msg.no-title .msg-head { padding: 2px 0; }
  .msg.think .badge { background: #b8bec7; }
  .msg.think .msg-title { color: var(--muted); }
  .msg.think .msg-body { color: var(--muted); font-style: italic; }
  /* 一轮结束的用时行：居中、细小，不抢内容 */
  .msg.note { border-bottom: none; padding: 2px 0 6px; text-align: center; }
  .msg-note { font-size: 12px; color: var(--tertiary); }
  .msg.open .msg-body {
    display: block; -webkit-line-clamp: unset; max-height: none; overflow: visible;
  }
  /* 正文里的 Markdown 基本样式，和 dsh 的阅读效果对齐 */
  .msg-body b { font-weight: 600; }
  .msg-body em { font-style: italic; }
  .msg-body .md-h { font-weight: 600; font-size: 14px; margin: 2px 0; }
  .msg-body ul { margin: 2px 0 2px 14px; padding: 0; }
  .msg-body li { list-style: disc; margin: 1px 0; }
  .msg-body pre {
    margin: 4px 0; padding: 8px 10px; border-radius: 8px; overflow-x: auto;
    background: var(--selector); font-size: 12px; line-height: 18px;
  }
  .msg-body pre code { background: transparent; padding: 0; font-size: 11px; }
  body.dark .msg-body pre { background: rgba(255,255,255,.06); }
  .msg-body::-webkit-scrollbar-thumb { border-radius: 2px; }
  .msg-body .path, .msg-body .url {
    text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px;
  }
  .msg-body code, .msg-body .path, .msg-body .url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: rgba(0,0,0,.05); border-radius: 4px; padding: 1px 4px; color: #2b2f36;
  }
  .msg-body .url { color: var(--accent); background: var(--hover); }
  .msg-body::-webkit-scrollbar { width: 3px; }
  .msg-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); }



  /* 上下文用量：底部一行概览，点开是参考 dsh 的卡片（分段条 + 三段明细） */
  /* 指令菜单：dsh ui-commands PopupSelectView.module.css */
  #cmd-menu {
    position: absolute; left: 10px; right: 10px; bottom: 104px; z-index: 7;
    padding: 4px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--field); box-shadow: 0 12px 30px rgba(0,0,0,.18);
    max-height: min(320px, 46vh); overflow-y: auto;
  }
  #cmd-menu[hidden] { display: none; }
  #cmd-menu button {
    display: flex; align-items: baseline; gap: 6px;
    width: 100%; padding: 5px 7px; border: none; border-radius: 12px;
    background: transparent; color: var(--fg); font-family: inherit;
    font-size: 12px; text-align: left;
  }
  #cmd-menu button.on { background: var(--hover); }
  #cmd-menu .cname { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cmd-menu .cdesc { flex: 1 1 auto; min-width: 0; font-size: 11px; color: var(--tertiary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cmd-menu.tip { padding: 7px 8px; font-size: 12px; color: var(--tertiary); }

  /* @ 引用菜单：同 popup 卡（PopupSelectView），行里带 file / directory 图标 */
  #at-menu {
    position: absolute; left: 10px; right: 10px; bottom: 104px; z-index: 7;
    padding: 4px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--field); box-shadow: 0 12px 30px rgba(0,0,0,.18);
    max-height: min(320px, 46vh); overflow-y: auto;
  }
  #at-menu[hidden] { display: none; }
  #at-menu button {
    display: flex; align-items: center; gap: 6px;
    width: 100%; padding: 5px 7px; border: none; border-radius: 12px;
    background: transparent; color: var(--fg); font-family: inherit;
    font-size: 12px; text-align: left;
  }
  #at-menu button.on { background: var(--hover); }
  #at-menu .afile { flex: 0 0 14px; width: 14px; height: 14px; color: var(--tertiary); }
  #at-menu .apath { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #at-menu.tip { padding: 7px 8px; font-size: 12px; color: var(--tertiary); }

  /* 权限菜单：和模型菜单同一套 Menu 规格 */
  #perm-menu {
    position: absolute; left: 10px; bottom: 104px; z-index: 6;
    min-width: min(240px, calc(100% - 20px)); max-width: min(320px, calc(100% - 20px));
    max-height: min(360px, 60vh); overflow-y: auto;
    padding: 4px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--field); box-shadow: 0 12px 30px rgba(0,0,0,.18);
  }
  #perm-menu[hidden] { display: none; }
  #perm-menu button {
    display: flex; align-items: center; gap: 6px;
    width: 100%; min-height: 34px; padding: 5px 7px;
    border: none; border-radius: 12px; background: transparent;
    color: var(--fg); font-family: inherit; font-size: var(--fs-secondary); text-align: left;
  }
  #perm-menu button .pglyph { display: inline-flex; flex: none; }
  #perm-menu button .pglyph svg { width: 16px; height: 16px; }
  #perm-menu button .pname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #perm-menu button .mcheck { flex: 0 0 14px; width: 14px; height: 14px; }
  #perm-menu button.on { background: var(--selector); }

  /* 模型菜单：dsh ui-primitives Menu.module.css + ModelSelect.module.css
     卡片 padding 4、radius 16、min-width 240、max-height 360；行 34 高、5 7、radius 12、13px */
  #model-menu {
    position: absolute; right: 10px; left: auto; bottom: 104px; z-index: 6;
    min-width: min(240px, calc(100% - 20px)); max-width: min(320px, calc(100% - 20px));
    max-height: min(360px, 60vh); overflow-y: auto;
    padding: 4px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--field);
    box-shadow: 0 12px 30px rgba(0,0,0,.18);
  }
  #model-menu[hidden] { display: none; }
  #model-menu button {
    display: flex; align-items: center; gap: 6px;
    width: 100%; min-height: 34px; padding: 5px 7px;
    border: none; border-radius: 12px; background: transparent;
    color: var(--fg); font-family: inherit; font-size: var(--fs-secondary);
    text-align: left;
  }
  #model-menu button .mname {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #model-menu button .mcheck { flex: 0 0 14px; width: 14px; height: 14px; color: var(--fg); }
  #model-menu button.on { background: var(--selector); }
  #model-menu.tip { padding: 8px; color: var(--tertiary); font-size: 12px; line-height: 18px; }

  #usage {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 4px 2px 0; color: var(--muted); font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  #usage[hidden] { display: none; }
  #usage-meter { flex: 1 1 auto; height: 3px; background: rgba(0,0,0,.10); border-radius: 2px; overflow: hidden; }
  #usage-fill { display: block; height: 100%; width: 0; background: var(--meter-msg); }

  /* 卡片：绝对定位浮在输入栏上方，样式对齐 dsh 的上下文弹层 */
  /* 上下文面板：照 dsh ContextMeter.module.css（264 宽、padding 12、radius lg、12px） */
  #usage-card {
    position: absolute; left: 10px; right: auto; bottom: 104px; z-index: 5;
    box-sizing: border-box; width: min(264px, calc(100% - 20px));
    padding: 12px; border-radius: 16px;
    background: var(--field);
    border: 1px solid var(--line);
    box-shadow: 0 12px 30px rgba(0,0,0,.16);
    font-size: 11.5px; line-height: 17px; color: var(--fg);
  }
  #usage-card[hidden] { display: none; }
  .uhead { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .uhead span { color: var(--muted); }
  .uhead b { font-size: 14px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .uhead em { margin-left: auto; font-style: normal; color: var(--caption); font-variant-numeric: tabular-nums; }
  .ubar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 8px 0 10px;
    background: var(--selector); }
  .ubar i { display: block; height: 100%; min-width: 2px; }
  .ubar .sys, .urow i.sys { background: var(--meter-sys); }
  .ubar .tools, .urow i.tools { background: var(--meter-tools); }
  .ubar .msg, .urow i.msg { background: var(--meter-msg); }
  .urow { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--muted); }
  .urow i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .urow span { flex: 1 1 auto; }
  .urow b { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
  #u-hint { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--warn); }
  #u-hint[hidden] { display: none; }
  #usage-card.warn .ubar .msg { background: var(--warn-soft); }
  #usage-card.danger .uhead b { color: #ff6b5e; }
  #usage-card.danger .ubar i { background: #ff6b5e; }

  /* 目标条：dsh GoalBar.module.css（36 高、gap 10、menu 底、13px 标签/目标） */
  #goalbar {
    position: relative;
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    height: 36px; margin: 6px 0 0; padding: 0 8px 0 10px;
    border-radius: 12px;
    background: var(--field);
    border: 0.5px solid var(--line-soft);
  }
  #goalbar[hidden] { display: none; }
  #goalbar::before {
    content: ''; position: absolute; left: 0; right: 0; top: -20px; height: 20px;
    background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0), rgba(var(--bg-rgb), 1));
    pointer-events: none;
  }
  #goalbar .gglyph { display: inline-flex; flex: none; color: var(--muted); }
  #goalbar .gglyph svg { width: 16px; height: 16px; }
  #goalbar .glabel {
    flex: none; font-size: 12px; line-height: 22px; font-weight: 500; color: var(--fg);
  }
  #goalbar .gobj {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    font-size: 12px; line-height: 18px; color: var(--muted);
    text-overflow: ellipsis; white-space: nowrap;
  }
  #goalbar .gactions { display: flex; align-items: center; gap: 10px; flex: none; }
  #goalbar .gbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0; border: none; border-radius: 999px;
    background: transparent; color: var(--tertiary);
  }
  #goalbar .gbtn svg { width: 16px; height: 16px; }
  #goalbar .gbtn:active { background: var(--selector); color: var(--muted); }

  /* 输入栏下方的 dock：ring 用量 + 会话统计（dsh InputBar .dock + ContextMeter） */
  #dock {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 4px 2px 0;
  }
  #meter {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    padding: 1px 8px; border: none; border-radius: 8px; background: transparent;
    color: var(--tertiary); font-family: inherit; font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  #meter[hidden] { display: none; }
  #meter[aria-expanded='true'] { background: var(--selector); color: var(--muted); }
  #stats {
    flex: 1 1 auto; display: flex; gap: 12px; justify-content: space-between;
    font-size: 11.5px; color: var(--tertiary); font-variant-numeric: tabular-nums;
  }
  #stats .st-group { display: inline-flex; align-items: center; gap: 5px; }
  #stats .st-ico { display: inline-flex; width: 13px; height: 13px; color: var(--caption); }
  #stats .st-ico svg { width: 13px; height: 13px; }
  #stats[hidden] { display: none; }

  /* 窗口很矮时（用户拖过）按优先级丢内容，别让输入栏被挤出窗口外 */
  body.short #dock { display: none !important; }
  body.short #compose { gap: 8px; padding-top: 6px; }
  body.short .msg-body { -webkit-line-clamp: 4; }
  body.tiny #goalbar { display: none !important; }

  /* ≡ 菜单的三个区块开关（宿主也会用 applyConfig 下发同样的类名） */
  body.hide-tabs #tabs { display: none !important; }
  body.hide-usage #usage-card, body.hide-usage #stats { display: none !important; }
  body.hide-compose #compose { display: none !important; }

  /* 附件预览：圆角缩略图 + 右上角移除，参照 dsh 的附件卡片 */
  #attach-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 2px 10px 0; }
  #attach-bar[hidden] { display: none; }
  .thumb { position: relative; width: 64px; height: 64px; border-radius: 20px; overflow: hidden;
    background: var(--selector); border: 0.5px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb img:not([src]), .thumb img[src=""] { display: none; }
  .thumb.empty::after {
    content: ''; position: absolute; inset: 14px; border: 2px solid #b8bec7; border-radius: 3px;
    background: linear-gradient(135deg, transparent 55%, #b8bec7 55% 62%, transparent 62%);
  }
  .file-chip { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px;
    border-radius: 4px; background: #f1f3f5; border: 1px solid rgba(0,0,0,.06); max-width: 100%; }
  .file-chip span { font-size: 11.5px; color: var(--fg); max-width: 150px; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .file-chip button { border: none; background: transparent; color: var(--muted); font-size: 13px; padding: 0 2px; }
  .thumb button {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border: none;
    border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px;
    line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
  }


  @media (max-width: 330px) {
    .uhead span { font-size: 13px; }
    .uhead b { font-size: 15px; }
    .urow { font-size: 10.5px; }
    #compose { padding: 10px 12px 8px; }
    /* 列表滚到边界时用一层渐变盖住被切开的最后半行（mask 在部分 WebView 不生效） */
  #compose::before {
    content: ''; position: absolute; left: 0; right: 0; top: -20px; height: 20px;
    background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0), rgba(var(--bg-rgb), 1));
    pointer-events: none;
  }
  #compose .row { gap: 8px; }
    .round { width: 28px; height: 28px; }
  }

  /* 输入栏：照 dsh InputBar（ui-conversation/src/client/skeleton/InputBar.module.css）
     card: padding-top 8 + gap 12；row: gap 12(窄卡 8)、padding 2px 8px 6px */
  #compose {
    position: relative;
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px;
    margin-top: 8px; padding: 8px 0 0;
    background: var(--field);
    border: 0.5px solid var(--line-soft);
    border-radius: 8px;
    font-size: var(--fs-content);
    line-height: var(--lh-content);
  }
  /* 列表滚到边界时用一层渐变盖住被切开的最后半行（mask 在部分 WebView 不生效） */
  #compose::before {
    content: ''; position: absolute; left: 0; right: 0; top: -20px; height: 20px;
    background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0), rgba(var(--bg-rgb), 1));
    pointer-events: none;
  }
  #compose .row {
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px 6px;
  }
  .round svg, #model svg { stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  /* add 圆钮：28×28、selector 底、14px 图标（InputBar .add） */
  .round {
    flex: 0 0 auto; width: 28px; height: 28px; border: none; border-radius: 999px;
    background: var(--selector); color: var(--fg);
    display: grid; place-items: center; padding: 0;
  }
  .round.flat { background: transparent; color: var(--muted); }
  .round svg { width: 16px; height: 16px; display: block; }
  #pick svg { width: 14px; height: 14px; }
  #pick svg path { stroke-width: 1.3; }   /* ICON_MEDIUM_STROKE */
  #mic svg path, #mic svg rect { stroke-width: 1.3; }
  #attach svg path { stroke-width: 1.3; }
  /* send 圆钮：34×34、button-info-fill、16px 实心箭头（InputBar .primary） */
  #send {
    width: 34px; height: 34px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center; padding: 0; flex: 0 0 auto;
  }
  #send svg { width: 16px; height: 16px; display: block; }
  #send .ico { display: grid; place-items: center; }
  #send .spin { display: none; }
  body.sending #send .arrow { display: none; }
  body.sending #send .spin { display: grid; }
  .sendingSpinner { animation: input-sending 800ms linear infinite; }
  @keyframes input-sending { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sendingSpinner { animation-duration: 2400ms; } }
  body.busy #send .arrow, body.busy #send .spin { display: none; }
  /* 停止：16 viewBox 里 10×10、rx 3（InputBar primaryStops 的矩形） */
  body.busy #send::after { content: ''; display: block; width: 10px; height: 10px;
    border-radius: 3px; background: currentColor; }
  #ask {
    width: 100%; min-height: 36px; max-height: 88px; resize: none; overflow-y: auto;
    background: transparent; border: none; outline: none;
    color: var(--fg);
    /* 触屏用 16px，避免 WebView 聚焦时自动缩放（InputBar 的 pointer:coarse 规则） */
    font-size: 14px; line-height: var(--lh-content);
    padding: 4px 8px 0 14px;
    font-family: inherit;
  }
  #ask::placeholder { color: #9aa0a6; }
  #ask::placeholder { color: var(--muted); }
  #perm, #model {
    flex: 0 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 4px 0 8px; border: none; border-radius: 8px;
    background: transparent; color: var(--muted); font-size: var(--fs-secondary);
    font-family: inherit;
  }
  /* 窄卡（<460px）只留图标，dsh 也是这么收的 */
  #compose.compact #perm .name, #compose.compact #model .name { display: none; }
  #model .mglyph { display: none; flex: none; }
  #model .mglyph svg { width: 14px; height: 14px; }
  #compose.compact #model .mglyph { display: inline-flex; }
  #compose.compact .row { gap: 6px; }
  #perm .pglyph { display: inline-flex; flex: none; }
  #perm .pglyph svg { width: 14px; height: 14px; }
  #model .name, #perm .name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 132px;
  }
  #model svg.chev, #perm svg.chev { width: 12px; height: 12px; color: var(--caption); flex: none; }
  #perm .name { max-width: 132px; }
  #compose .sep { width: 1px; height: 18px; background: rgba(255,255,255,.10); flex: 0 0 auto; }

  #send:disabled { opacity: .4; }
  /* 操作提示条：发送失败 / 没会话 / 正在唤起时把原因写出来，不能点了没反应 */
  #notice {
    flex: 0 0 auto; margin: 0 10px 6px; padding: 5px 8px;
    font-size: 11px; line-height: 15px; border-radius: 6px;
    background: rgba(255, 107, 94, .13); color: var(--danger);
  }
  #notice[hidden] { display: none; }
  #notice.ok { background: var(--hover); color: var(--accent); }
  /* 底栏统计：N 轮 M 步 ｜ 累计用量 · 缓存命中（对齐 dsh 的 stats 那行） */
  #stats {
    flex: 0 0 auto; display: flex; gap: 10px; justify-content: space-between;
    padding: 6px 2px 0; font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #stats[hidden] { display: none; }

  /* 窗口很矮时（用户拖过）按优先级丢内容，别让输入栏被挤出窗口外 */
  body.short #dock { display: none !important; }
  body.short #compose { gap: 8px; padding-top: 6px; }
  body.short .msg-body { -webkit-line-clamp: 4; }
  body.tiny #goalbar { display: none !important; }

  /* ≡ 菜单的三个区块开关（宿主也会用 applyConfig 下发同样的类名） */
  body.hide-tabs #tabs { display: none !important; }
  body.hide-usage #usage-card, body.hide-usage #stats { display: none !important; }
  body.hide-compose #compose { display: none !important; }
  #actions { flex: 0 0 auto; display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #actions[hidden] { display: none; }
  #hint {
    flex: 1 1 auto; font-size: 12px; color: var(--warn); align-self: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.act { border: none; padding: 5px 12px; font-size: 12px; font-weight: 600; color: #fff; }
  #deny { background: rgba(255, 107, 94, .18); color: var(--danger); }
  #allow { background: var(--ok); }
  /* 右下角缩放标识：仅提示，实际拖拽由原生触摸层完成 */
  #grip {
    position: absolute; right: 3px; bottom: 3px; width: 12px; height: 12px;
    pointer-events: none; opacity: .5;
    border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted);
  }

  /* ═════════ 迷你（1）/ 标准（2）两档：同一套新布局；完整档（3）是 dsh 页面本身 ═════════
     顶行是会话标签与「新会话」，标签右边的空白是原生拖动区，再右是原生窗口按钮。 */
  #fwtop, #fwbody { display: none; }
  body.fw #head, body.fw #tabrow, body.fw #list, body.fw #usage-card,
  body.fw #goalbar, body.fw #dock, body.fw #menu, body.fw #grip,
  body.fw #perm-menu, body.fw #model-menu { display: none !important; }
  body.t1 #cmd-menu, body.t1 #at-menu, body.t1 #notice { display: none !important; }
  body.fw {
    --fw-bg: rgba(255, 255, 255, var(--alpha, .8));
    --fw-line: rgba(0, 0, 0, .06);
    --fw-field: rgba(255, 255, 255, .72);
    --fw-text: rgb(53, 54, 56);          /* neutral-bluish-800，比纯黑浅一档 */
    --fw-sub: rgb(129, 133, 140);        /* label-tertiary */
    --fw-chip: rgba(38, 49, 72, .06);    /* interactive-bg-hover */
    --fw-bubble: rgba(237, 243, 254, .9);/* deepseek-50 */
    --fw-btns: 62px;
  }
  body.fw.dark {
    --fw-bg: rgba(27, 27, 28, var(--alpha, .8));
    --fw-line: rgba(255, 255, 255, .08);
    --fw-field: rgba(255, 255, 255, .06);
    --fw-text: rgb(225, 229, 238);
    --fw-sub: rgb(151, 157, 166);
    --fw-chip: rgba(255, 255, 255, .08);
    --fw-bubble: rgba(122, 170, 255, .14);
  }
  body.t2 { --fw-btns: 146px; }
  body.fw #card {
    padding: 0 8px 8px;
    background: var(--fw-bg);
    border: 0.5px solid var(--fw-line);
    box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
    color: var(--fw-text);
  }
  body.t1 #card { height: auto; }

  /* 顶行照 dsh 的「对话 / 轨迹」标签：文字标签 + 当前项 2px 下划线 + 整行底线；
     标签后面紧跟「＋」，剩下的空间放状态（计时 / 时间），这块同时是原生拖动区 */
  body.fw #fwtop {
    display: flex; flex: 0 0 auto; height: 30px; align-items: stretch; gap: 10px;
    margin: 0 -8px 6px; padding: 0 calc(var(--fw-btns) + 4px) 0 12px;
    border-bottom: 0.5px solid var(--fw-line);
  }
  #fwtabs {
    display: flex; align-items: stretch; gap: 14px; min-width: 0; flex: 0 1 auto;
    max-width: calc(100% - 76px);
    overflow-x: auto; scrollbar-width: none;
  }
  #fwtabs::-webkit-scrollbar { display: none; }
  .fwtab {
    position: relative; flex: none; display: inline-flex; align-items: center; gap: 4px;
    max-width: 96px; padding: 0 1px; border: none; background: transparent; color: var(--fw-sub);
    font: inherit; font-size: 12px; line-height: 18px; white-space: nowrap;
  }
  .fwtab span { overflow: hidden; text-overflow: ellipsis; }
  .fwtab.on { color: var(--fw-text); font-weight: 600; }
  .fwtab.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    border-radius: 1px; background: var(--accent);
  }
  .fwtab i { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    animation: fw-pulse 1.2s ease-in-out infinite; }
  @keyframes fw-pulse { 50% { opacity: .3; } }
  .fwtab.new { padding: 0 2px; margin-left: -4px; }
  .fwtab.new svg { width: 12px; height: 12px; display: block; }
  #fwstat {
    flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: flex-end;
    font-size: 11px; color: var(--fw-sub); white-space: nowrap; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  body.running #fwstat { color: var(--accent); }

  body.fw #fwbody { display: flex; flex-direction: column; min-height: 0; }
  body.t2 #fwbody { flex: 1 1 auto; }
  /* 迷你：本轮最新的思考单独一行（显示最新写到的部分），点开看全文；和回答各自展开 */
  #think-row { display: none; }
  body.t1 #think-row.has {
    display: flex; align-items: flex-start; gap: 6px; padding: 0 4px 4px;
    font-size: 12px; line-height: 18px; color: var(--fw-sub);
  }
  #think-row .lab { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; }
  #think-row .lab svg { width: 12px; height: 12px; display: block; }
  #think-row.live .lab { color: var(--accent); }
  #think-row .clip { flex: 1 1 auto; min-width: 0; display: flex; overflow: hidden; white-space: nowrap; }
  #think-row .clip.over {
    justify-content: flex-end;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 24px);
    mask-image: linear-gradient(to right, transparent 0, #000 24px);
  }
  #think-row.open .clip {
    display: block; white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 160px; overflow-y: auto; -webkit-mask-image: none; mask-image: none;
  }
  #think-row .clip::-webkit-scrollbar { width: 0; }
  /* 迷你：最新回答的结尾几行连续显示，旧内容从上沿渐隐出去（不在句尾截断）；点一下看全文 */
  #tail, #tail-step, #mlist { display: none; }
  body.t1 #tail {
    display: flex; flex-direction: column; justify-content: flex-end;
    max-height: 60px; overflow: hidden; padding: 0 4px;
    font-size: 13px; line-height: 20px; color: var(--fw-text);
  }
  body.t1 #tail.over {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 24px);
  }
  body.t1 #tail.open {
    display: block; max-height: 280px; overflow-y: auto;
    -webkit-mask-image: none; mask-image: none;
  }
  #tail::-webkit-scrollbar { width: 0; }
  #tail-text { overflow-wrap: anywhere; }
  #tail.open #tail-text { white-space: pre-wrap; }
  body.t1 #tail-step:not(:empty) {
    display: block; padding: 2px 4px 0;
    font-size: 11px; line-height: 16px; color: var(--fw-sub);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 标准：完整对话，全部内容不截断；思考 / 工具是一行，点开看全文 */
  body.t2 #mlist {
    display: block; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 2px 4px 6px; font-size: 13px; line-height: 20px;
  }
  #mlist::-webkit-scrollbar { width: 0; }
  .m-user { display: flex; justify-content: flex-end; margin: 10px 0 4px; }
  .m-user div {
    max-width: 84%; padding: 6px 10px; border-radius: 8px;
    background: var(--fw-bubble); color: var(--fw-text);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .m-text { margin: 4px 0; color: var(--fw-text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .m-text.sub, .m-step.sub { margin-left: 12px; }
  #tail code, .m-text code { font-size: 12px; padding: 0 3px; border-radius: 3px; background: var(--fw-chip); }
  #tail pre, .m-text pre {
    margin: 4px 0; padding: 6px 8px; border-radius: 4px; background: var(--fw-chip);
    font-size: 12px; line-height: 18px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #tail ul, .m-text ul { margin: 2px 0; padding-left: 18px; white-space: normal; }
  #tail .md-h, .m-text .md-h { font-weight: 600; }
  .m-step {
    display: flex; align-items: flex-start; gap: 6px; padding: 2px 0;
    font-size: 12px; line-height: 18px; color: var(--fw-sub);
  }
  .m-step .ic { flex: none; width: 14px; height: 18px; display: grid; place-items: center; }
  .m-step .ic svg { width: 12px; height: 12px; display: block; }
  .m-step .tx { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-step .tx b { font-weight: 500; }
  .m-step.open .tx { white-space: pre-wrap; overflow-wrap: anywhere; }
  .m-step.fail .ic { color: var(--danger); }
  .m-note { margin: 6px 0; text-align: center; font-size: 11px; line-height: 16px; color: var(--fw-sub); }
  .m-run { display: flex; align-items: center; gap: 6px; margin: 6px 0 2px; font-size: 12px; line-height: 18px; color: var(--accent); }
  .m-run span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-run i { flex: none; width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: fw-pulse 1.2s ease-in-out infinite; }
  .m-empty { padding: 28px 0; text-align: center; font-size: 12px; color: var(--fw-sub); }

  /* 输入：一行 [+] 输入框 [发送]；+ 就地展开 图片 / 文件 / 语音；有字或在跑才出右侧按钮 */
  body.fw #compose {
    flex-direction: row; align-items: center; gap: 2px;
    margin-top: 6px; padding: 2px 4px;
    background: var(--fw-field); border: 0.5px solid var(--fw-line); border-radius: 6px;
  }
  body.fw #compose::before { display: none; }
  body.fw #compose .row { display: contents; }
  body.fw #compose .row > span[style] { display: none; }
  body.fw #perm, body.fw #model { display: none !important; }
  body.fw #pick { order: 0; width: 28px; height: 28px; background: transparent; color: var(--fw-sub); }
  body.fw #pick svg { transition: transform .15s ease; }
  body.fw.plus-open #pick svg { transform: rotate(45deg); }
  body.fw #img, body.fw #attach, body.fw #mic { display: none; order: 1; width: 28px; height: 28px; color: var(--fw-sub); }
  body.fw.plus-open #img, body.fw.plus-open #attach, body.fw.plus-open #mic { display: grid; }
  body.fw #ask {
    order: 2; flex: 1 1 auto; min-width: 0;
    min-height: 28px; height: 28px; max-height: 64px;
    padding: 4px; font-size: 14px; line-height: 20px; color: var(--fw-text);
  }
  body.fw #ask::placeholder { color: var(--fw-sub); }
  body.fw #send { order: 3; width: 26px; height: 26px; }
  body.fw #send svg { width: 13px; height: 13px; }
  body.fw:not(.has-text):not(.busy):not(.sending) #send { display: none; }
  body.fw #attach-bar { padding: 6px 2px 0; }
  #img { display: none; }

  /* 语音：录音/识别时整行换成状态条 —— 红点+计时、实时音量波形、取消/完成 */
  #voicebar { display: none; }
  body.voice-on #compose > #ask, body.voice-on #compose .row > * { display: none !important; }
  body.voice-on #voicebar {
    display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0;
    height: 28px; padding: 0 0 0 6px; font-size: 12px; line-height: 16px; color: var(--fw-text, var(--text));
  }
  #voicebar .vdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--danger, #e5484d); animation: fw-pulse 1.2s ease-in-out infinite; }
  #voicebar .vlab { flex: none; white-space: nowrap; }
  #voicebar .vtime { flex: none; font-variant-numeric: tabular-nums; color: var(--fw-sub, var(--muted)); }
  #voicebar .vwave { flex: 1 1 auto; min-width: 0; height: 18px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; overflow: hidden; }
  #voicebar .vwave i { flex: none; width: 2px; min-height: 2px; background: var(--fw-sub, var(--muted)); opacity: .55; transition: height .08s linear; }
  #voicebar .vwave i.on { background: var(--accent); opacity: 1; }
  #voicebar button {
    flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 4px;
    display: grid; place-items: center; background: transparent; color: var(--fw-sub, var(--muted));
  }
  #voicebar button svg { width: 14px; height: 14px; display: block; }
  #voicebar #vdone { width: 26px; height: 26px; background: var(--accent); color: #fff; }
  #voicebar .vspin { display: none; flex: none; width: 12px; height: 12px; }
  #voicebar .vspin svg { width: 12px; height: 12px; display: block; animation: fw-spin .9s linear infinite; color: var(--accent); }
  #voicebar[data-s="transcribing"] .vdot, #voicebar[data-s="transcribing"] .vtime,
  #voicebar[data-s="transcribing"] .vwave i, #voicebar[data-s="transcribing"] #vdone { display: none; }
  #voicebar[data-s="transcribing"] .vspin { display: block; }
  #voicebar[data-s="error"] .vdot { animation: none; }
  #voicebar[data-s="error"] .vlab { color: var(--danger, #e5484d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  #voicebar[data-s="error"] .vtime, #voicebar[data-s="error"] .vwave, #voicebar[data-s="error"] #vdone { display: none; }
  #voicebar[data-s="error"] .vdot { background: var(--danger, #e5484d); }
  @keyframes fw-spin { to { transform: rotate(360deg); } }
</style>
</head>

      </button>
      <button class="round flat" id="mic" title="语音" aria-label="语音">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5.15" y="1.65" width="5.7" height="8.7" rx="2.85"/><path d="M2.35 8.675C3.075 11.3 5.2 13.125 8 13.125C10.8 13.125 12.925 11.3 13.65 8.675M8 13.125V15"/></svg>
      </button>
      <button id="send" title="发送消息" aria-label="发送消息">
        <span class="ico arrow"><svg viewBox="0 0 16 16"><path d="M8.3125 0.980183C8.66767 1.0531 8.97902 1.20418 9.2627 1.43233C9.48724 1.61297 9.73029 1.85793 9.97949 2.10714L14.707 6.83468L13.293 8.24874L9 3.95577V15.0417H7V3.95577L2.70703 8.24874L1.29297 6.83468L6.02051 2.10714C6.26971 1.85793 6.51277 1.61297 6.7373 1.43233C6.97662 1.23986 7.28445 1.04402 7.6875 0.980183C7.8973 0.947006 8.1031 0.95516 8.3125 0.980183Z" fill="currentColor"/></svg></span>
        <span class="ico spin"><svg class="sendingSpinner" viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      </button>

  </div>
  <div id="dock">
    <div id="stats" hidden>
      <span class="st-group"><span class="st-ico" id="st-ico-left"></span><span id="st-left"></span></span>

    </div>
  </div>
  <div id="actions" hidden>
    <span id="hint"></span>

    <button class="act" id="allow">允许</button>
