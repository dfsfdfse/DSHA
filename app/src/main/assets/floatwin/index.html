  <div id="grip"></div>
</div>
<script>
(function () {
  const post = (method, params) => {
    try { DshaFloat.postMessage(JSON.stringify({ method, params: params || {} })); } catch (_) {}
  };
  const el = id => document.getElementById(id);

  /**
   * 统一的点按绑定。
   *
   * 悬浮窗里出现过「按钮点不动、但输入框能打字」：原生命中按钮时输入框先失焦，
   * 失焦会改窗口 flags，updateViewLayout 把还在按着的手势判成取消，
   * 手指抬起后的 click 就不再派发。这里在 pointerup 上先触发一次，click 只兜底，
   * 350ms 内去重，保证「按下去就有反应」。
   */
  function onTap(node, handler) {
    if (!node) return;
    let last = 0;
    const fire = ev => {
      const now = Date.now();
      if (now - last < 350) return;
      last = now;
      handler(ev);
    };
    node.addEventListener('pointerup', fire);
    node.addEventListener('click', fire);
  }
  let state = { tasks: [], active: '', models: [], threads: [], modelName: '' };
  /** 已经请过宿主导入历史的会话，避免重复请求。 */
  const historyAsked = new Set();
  let signature = '';
  let openId = '';
  let busy = false;
  /** 最近一次已知的会话 id：状态还没送到时也能把消息投回对的会话。 */
  let lastSession = '';

  function activeTask() {
    if (!state.tasks.length) return null;
    return state.tasks.find(t => t.id === state.active) || state.tasks[0];
  }

  let running = false;
  function syncBusy(nextBusy) {
    running = !!nextBusy;
    if (nextBusy === busy) return;
    busy = nextBusy;
    post('busy', { value: busy });
  }

  /** 输入框里有内容时按钮就是「发送」，空着时才变「停止」——
   *  否则 agent 正在干活时想再问一句，按下去会把任务停掉，看着就像「按钮点不动」。 */
  function hasContent() {
    return !!(String(el('ask').value || '').trim() || pendingImage || pendingFile);
  }

  function refreshSendMode() {
    const stop = running && !hasContent();
    document.body.classList.toggle('busy', stop);
    document.body.classList.toggle('has-text', hasContent());
    const btn = el('send');
    // dsh 文案：input.send='发送消息' / input.stop='停止生成'
    const label = stop ? '停止生成' : '发送消息';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }

  /** 按窗口实际高度决定保留哪些块（矮窗先丢统计行，再丢目标条）。 */
  function applyHeightTier() {
    const card = el('card');
    if (!card) return;
    const h = card.clientHeight;
    document.body.classList.toggle('short', h > 0 && h < 300);
    document.body.classList.toggle('tiny', h > 0 && h < 220);
  }

  function setView(view, rerender) {
    const trace = view === 'trace';
    document.body.classList.toggle('trace', trace);
    try { localStorage.setItem('floatwin_view', trace ? 'trace' : 'chat'); } catch (_) {}
    const chatBtn = el('view-chat');
    const traceBtn = el('view-trace');
    if (chatBtn) chatBtn.classList.toggle('on', !trace);
    if (traceBtn) traceBtn.classList.toggle('on', trace);
    if (rerender) {
      const list = el('list');
      if (list) list.dataset.sig = '';
      render(state);
      post('resize', {});
    }
  }

  let sendingTimer = 0;
  function setSending(on) {
    document.body.classList.toggle('sending', !!on);
    clearTimeout(sendingTimer);
    if (on) sendingTimer = setTimeout(() => document.body.classList.remove('sending'), 6000);
  }

  let noticeTimer = 0;
  function showNotice(text, ms, ok) {
    const box = el('notice');
    if (!text) {
      box.hidden = true;
      box.textContent = '';
      return;
    }
    box.textContent = text;
    box.classList.toggle('ok', !!ok);
    box.hidden = false;
    clearTimeout(noticeTimer);
    if (ms) noticeTimer = setTimeout(() => { box.hidden = true; }, ms);
    // 提示条出现会把输入栏往上顶：菜单开着就跟着挪，别压住字
    const menu = el('model-menu');
    if (menu && !menu.hidden) placeModelMenu();
  }


  /** 权限图标：取自 dsh PermissionIcon.tsx（16 viewBox，medium 1.3 描边）。 */
  const PERM_GLYPHS = {
    'read-only': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5.08545 8.13775L7.18455 10.2368C7.26636 10.3187 7.4003 10.3142 7.47649 10.2271L11.5148 5.61194"/><path d="M6.59624 2.14853C7.50155 1.80917 8.49914 1.80919 9.40444 2.14859L13.9245 3.84317V7.11961C13.9245 11.6089 10.5565 13.5975 8.00035 14.5779C5.44423 13.5975 2.07544 11.6089 2.07544 7.11961V3.84317L6.59624 2.14853Z" stroke-linejoin="round"/></svg>',
    'workspace-write': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.4209 1.68067C7.43922 1.299 8.56177 1.29898 9.58008 1.68067L14.0996 3.375C14.2946 3.44811 14.4236 3.63455 14.4238 3.84278V6.89063C14.1115 6.71853 13.7761 6.58312 13.4238 6.48926V4.18946L9.22852 2.61621C8.43657 2.31947 7.56341 2.31939 6.77148 2.61621L2.5752 4.18946V7.11914C2.5752 11.1796 5.52369 13.056 8 14.0391C8.27653 13.9293 8.55827 13.8067 8.8418 13.6729C9.07101 13.9468 9.33228 14.1929 9.62012 14.4053C9.12409 14.6579 8.63578 14.8696 8.17871 15.0449C8.0637 15.0889 7.93628 15.0889 7.82129 15.0449C5.22011 14.0472 1.5752 11.9381 1.5752 7.11914V3.84278C1.57541 3.63469 1.70463 3.44821 1.89941 3.375L6.4209 1.68067Z" fill="currentColor"/><path d="M5.26392 6.60339H10.7361"/><path d="M5.26392 9.86902H8.32833"/><path d="M10.0317 13.2229C10.263 13.3929 10.4943 13.563 10.7256 13.733C10.7932 13.6482 10.8608 13.5634 10.9284 13.4786C12.1455 11.9522 13.3626 10.4258 14.5798 8.89935C14.6474 8.81455 14.715 8.72975 14.7826 8.64495C14.4143 8.37419 14.046 8.10344 13.6777 7.83268C13.6169 7.92252 13.5562 8.01236 13.4954 8.10219C12.4016 9.71926 11.3078 11.3363 10.214 12.9534C10.1532 13.0432 10.0924 13.1331 10.0317 13.2229Z" fill="currentColor"/><path d="M12.6516 12.6696V13.4359L15.2651 13.5527V12.5527L12.6516 12.6696Z" fill="currentColor"/></svg>',
    'danger-full-access': '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.59624 2.14853C7.50155 1.80917 8.49914 1.80919 9.40444 2.14859L13.9245 3.84317V7.11961C13.9245 11.6089 10.5565 13.5975 8.00035 14.5779C5.44423 13.5975 2.07544 11.6089 2.07544 7.11961V3.84317L6.59624 2.14853Z" stroke-linejoin="round"/><path d="M8 4.39209V9.89209"/><path d="M8 10.8081V11.8081"/></svg>',
    auto: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.59624 2.14853C7.50155 1.80917 8.49914 1.80919 9.40444 2.14859L13.9245 3.84317V7.11961C13.9245 11.6089 10.5565 13.5975 8.00035 14.5779C5.44423 13.5975 2.07544 11.6089 2.07544 7.11961V3.84317L6.59624 2.14853Z" stroke-linejoin="round"/><path d="M5.75 10.15L8 4.95L10.25 10.15M6.43 8.59H9.57" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  /** 预设中文名：dsh ui-permission-presets locales.ts */
  const PERM_LABELS = {
    'read-only': '仅可查看',
    'workspace-write': '工作区内修改',
    'danger-full-access': '完全权限',
    auto: '自动审查',
  };
  const PERM_ORDER = ['read-only', 'workspace-write', 'danger-full-access', 'auto'];
  /** 需要二次确认的危险预设（dsh 的 RiskConfirmation） */
  const PERM_RISKY = { 'danger-full-access': true, auto: true };

  /** dsh 原文：conversation.placeholder.default */
  const PLACEHOLDER = '发消息或创建任务, / 调用指令, @ 文件或对话';
  /** 迷你档一行放不下整句，换成短的。 */
  const placeholderNow = () => (!document.body.classList.contains('fw') ? PLACEHOLDER
    : selectedId === 'new' ? '新会话：发消息…' : '发消息…');

  let pendingImage = '';
  let pendingFile = '';

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /** 行内标记：反引号代码、粗体、斜体，外加 URL / 路径高亮。 */
  function inlineMarkdown(escaped) {
    return escaped
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<span class="url">$1</span>')
      .replace(/(^|[\s(])((?:\/[\w.\/-]{2,})|(?:[\w.-]+(?:\/[\w.-]+){2,}\/?))/g,
        '$1<span class="path">$2</span>');
  }

  /**
   * 正文按 dsh 那样渲染 Markdown：标题、列表、围栏代码块、行内标记。
   * 只做这些：不做表格/图片，够读就行，也避免把 HTML 注入进来。
   */
  function formatBody(text) {
    const lines = String(text == null ? '' : text).split('\n');
    let html = '';
    let fence = false;
    let list = false;
    const closeList = () => { if (list) { html += '</ul>'; list = false; } };
    for (const raw of lines) {
      if (/^\s*```/.test(raw)) {
        closeList();
        html += fence ? '</code></pre>' : '<pre><code>';
        fence = !fence;
        continue;
      }
      if (fence) { html += escapeHtml(raw) + '\n'; continue; }
      const line = escapeHtml(raw);
      const heading = /^#{1,6}\s+(.*)$/.exec(line);
      if (heading) {
        closeList();
        html += '<div class="md-h">' + inlineMarkdown(heading[1]) + '</div>';
        continue;
      }
      const item = /^\s*(?:[-*+]|\d+\.)\s+(.*)$/.exec(line);
      if (item) {
        if (!list) { html += '<ul>'; list = true; }
        html += '<li>' + inlineMarkdown(item[1]) + '</li>';
        continue;
      }
      closeList();
      html += inlineMarkdown(line) + '\n';
    }
    closeList();
    if (fence) html += '</code></pre>';
    return html;
  }

  function formatTime(at) {
    const ms = Number(at);
    if (!Number.isFinite(ms) || ms <= 0) return '';
    const d = new Date(ms);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  /** 毫秒 → 「2 分 13 秒」，和 dsh 的写法一致。 */
  function fmtDuration(ms) {
    const total = Math.max(1, Math.round(Number(ms) / 1000));
    if (total < 60) return total + ' 秒';
    const m = Math.floor(total / 60);
    const sec = total % 60;
    if (m < 60) return sec ? m + ' 分 ' + sec + ' 秒' : m + ' 分';
    return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
  }

  let workingTimer = 0;
  /** 正在处理那行跟着走秒（dsh 是「深度求索中，用时 6 分 13 秒 ···」）。 */
  function startWorkingClock(label, since) {
    if (workingTimer) { clearInterval(workingTimer); workingTimer = 0; }
    if (!since) return;
    const paint = () => { label.textContent = '深度求索中，用时 ' + fmtDuration(Date.now() - since) + ' ···'; };
    paint();
    workingTimer = setInterval(paint, 1000);
  }

  function shortK(n) {
    if (!Number.isFinite(n)) return '?';
    if (n >= 1000000) {
      const m = n / 1000000;
      return (m >= 10 ? Math.round(m) : m.toFixed(1).replace(/\.0$/, '')) + 'M';
    }
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }

  function renderUsage(usage) {
    const meter = el('meter');
    if (!usage || !Number.isFinite(usage.used) || !Number.isFinite(usage.window) || usage.window <= 0) {
      el('usage-card').hidden = true;
      if (meter) meter.hidden = true;
      return;
    }
    const pct = Math.min(100, Math.round((usage.used / usage.window) * 100));
    // dsh 的 ContextMeter：14px 圆环（r=5.5, stroke 2）+ 百分比
    if (meter) {
      meter.hidden = false;
      const circumference = 2 * Math.PI * 5.5;
      el('meter-fill').setAttribute('stroke-dasharray',
        (circumference * pct / 100).toFixed(2) + ' ' + circumference.toFixed(2));
      el('meter-pct').textContent = pct + '%';
      meter.setAttribute('aria-label', '上下文已用 ' + pct + '%');
    }
    el('u-pct').textContent = pct + '%';
    const card = el('usage-card');
    card.classList.toggle('warn', pct >= 75 && pct < 90);
    card.classList.toggle('danger', pct >= 90);
    el('u-hint').hidden = pct < 90;
    el('u-total').textContent = '~' + shortK(usage.used) + ' / ' + shortK(usage.window);
    // 和 dsh 一致：三段按「占整个上下文窗口」的比例画，剩余部分留空底色
    const win = Math.max(1, usage.window);
    el('ub-sys').style.width = ((usage.system || 0) / win * 100) + '%';
    el('ub-tools').style.width = ((usage.tools || 0) / win * 100) + '%';
    el('ub-msg').style.width = ((usage.messages || 0) / win * 100) + '%';
    el('u-sys').textContent = '~' + shortK(usage.system);
    el('u-tools').textContent = '~' + shortK(usage.tools);
    el('u-msg').textContent = '~' + shortK(usage.messages);
  }

  const blocks = { tabs: 'hide-tabs', usage: 'hide-usage', compose: 'hide-compose' };
  try {
    const saved = JSON.parse(localStorage.getItem('floatwin_blocks') || '{}');
    Object.keys(blocks).forEach(k => {
      if (saved[k] === false) document.body.classList.add(blocks[k]);
    });
  } catch (_) {}

  function syncSwitches() {
    Object.keys(blocks).forEach(k => {
      const on = !document.body.classList.contains(blocks[k]);
      const sw = el('sw-' + k);
      if (sw) sw.classList.toggle('on', on);
    });
  }

  window.dshFloat = {
    /** 内置能力调用：hidden 是逗号分隔的区块名（tabs/usage/compose），空串表示全部显示。 */
    applyConfig: function (hidden) {
      const names = String(hidden || '').split(',').map(x => x.trim()).filter(Boolean);
      Object.keys(blocks).forEach(k => {
        document.body.classList.toggle(blocks[k], names.includes(k));
      });
      try { localStorage.setItem('floatwin_blocks', JSON.stringify({})); } catch (_) {}
      syncSwitches();
      post('resize', {});
    },
    openModelMenu: function () {
      const menu = el('model-menu');
      if (buildModelMenu()) menu.hidden = false;
    },
    toggleMenu: function () {
      const menu = el('menu');
      menu.hidden = !menu.hidden;
      if (!menu.hidden) syncSwitches();
    },
    setTier: function (n) { applyTier(n); },
    toggle: function () {
      // 迷你档：轻点顶行 = 展开 / 收起最新回答
      if (isFw()) { toggleTail(); return; }
      // 轻点拖动条：展开/收起最新一条消息
      const msgs = document.querySelectorAll('#list .msg');
      if (!msgs.length) return;
      const last = msgs[msgs.length - 1];
      last.classList.toggle('open');
      openId = last.classList.contains('open') ? last.dataset.id : '';
      post('activity', {});
      post('resize', {});
    },
    onVoice: function (text) {
      const box = el('ask');
      voiceUi('idle');
      if (!text) return;
      box.value = (box.value ? box.value + ' ' : '') + text;
      box.dispatchEvent(new Event('input'));
      post('focus', { value: true });
      box.focus();
    },
    onVoiceState: function (state) {
      voiceUi(state);
    },
    onVoiceLevel: function (level, ms, loud, spoke) {
      voiceLevel(level, ms, loud, spoke);
    },
    onVoiceError: function (message) {
      voiceUi('error', message || '没听清，再说一次');
    },
    onFile: function (path, name) {
      pendingFile = path || '';
      if (pendingFile) {
        el('file-name').textContent = name || '';
        el('file-chip').hidden = false;
        el('thumb').hidden = !pendingImage;
        el('attach-bar').hidden = false;
      }
      post('focus', { value: true });
      refreshSendMode();
    },
    onImage: function (path, dataUrl) {
      pendingImage = path || '';
      if (pendingImage) {
        if (dataUrl) {
          el('thumb-img').src = dataUrl;
          el('thumb-img').parentElement.classList.remove('empty');
        } else {
          el('thumb-img').removeAttribute('src');
          el('thumb-img').parentElement.classList.add('empty');
        }
        el('attach-bar').hidden = false;
        el('ask').placeholder = '图片已就绪，发送即带上';
      } else {
        el('attach-bar').hidden = true;
        el('thumb-img').removeAttribute('src');
        el('thumb-img').parentElement.classList.remove('empty');
        el('ask').placeholder = placeholderNow();
      }
      post('focus', { value: true });
      refreshSendMode();
    },
    onData: function (json) {
      let d = json;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
      render(d || {});
    }
  };

  // ═════════ 新布局：迷你（1）/ 标准（2） ═════════
  let tier = 0;
  let fwEmpty = true;
  /** '' = 跟随最近活跃的会话；'new' = 新会话草稿；其他 = 用户点选的会话 id。 */
  let selectedId = '';
  /** 发了「新会话」的第一句后，等新会话出现在状态里再切过去。 */
  let newSince = null;
  const askedThread = new Set();
  const openSteps = new Set();
  let tailSig = '';
  let listSig2 = '';
  let fwTimer = 0;
  let lastFit = 0;
  let lastDrag = -1;
  const isFw = () => document.body.classList.contains('fw');
  const isTop = m => !(m.depth > 0);

  /** 宿主按窗口档位下发：1 迷你，其余按标准处理（3 档是 dsh 页面，不会走到这里）。 */
  function applyTier(n) {
    n = Number(n) === 1 ? 1 : 2;
    if (n === tier) return;
    tier = n;
    const b = document.body.classList;
    b.add('fw');
    b.toggle('t1', n === 1);
    b.toggle('t2', n === 2);
    b.remove('plus-open');
    el('tail').classList.remove('open');
    tailSig = '';
    listSig2 = '';
    lastFit = 0;
    lastDrag = -1;
    if (!pendingImage) el('ask').placeholder = placeholderNow();
    renderFw();
  }

  function currentTask() {
    if (selectedId === 'new') return null;
    if (selectedId) return state.tasks.find(t => t.id === selectedId) || null;
    return fwEmpty ? null : activeTask();
  }
  function currentId() {
    if (selectedId) return selectedId;
    const t = currentTask();
    return t ? t.id : '';
  }

  /** 迷你档的折叠视图：去掉代码块与 Markdown 记号，换行压成空格，读起来是连续的一段。 */
  function plainText(text) {
    return String(text == null ? '' : text)
      .replace(/```[\s\S]*?```/g, ' [代码] ')
      .replace(/```/g, '')
      .replace(/`([^`]*)`/g, '$1')
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/^\s{0,3}#{1,6}\s+/gm, '')
      .replace(/^\s*>\s?/gm, '')
      .replace(/^\s*(?:[-*+]|\d+\.)\s+/gm, '· ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  // 插件给工具名带了「⚙ 」之类的前缀符号，图标已经有了，去掉
  const stepName = m => (m.kind === 'think' ? '思考'
    : String(m.title || '工具').replace(/^[^\p{L}\p{N}]+/u, '') || '工具');

  /** 本轮（最后一句提问之后）的消息下标范围。 */
  function turnOf(task) {
    const msgs = task && Array.isArray(task.messages) ? task.messages : [];
    let lastUser = -1;
    for (let i = msgs.length - 1; i >= 0; i--) {
      if (msgs[i].kind === 'user' && isTop(msgs[i])) { lastUser = i; break; }
    }
    return { msgs, lastUser };
  }

  /** 迷你档要显示的回答：本轮所有正文段连起来；本轮还没有就用最近一段。 */
  function answerOf(task) {
    const { msgs, lastUser } = turnOf(task);
    const parts = [];
    for (let i = lastUser + 1; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.kind === 'assistant' && isTop(m) && m.text) parts.push(String(m.text));
    }
    if (parts.length) return parts.join('\n\n');
    if (task && !task.done) return '';
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      if (m.kind === 'assistant' && isTop(m) && m.text) return String(m.text);
    }
    return '';
  }

  function tabRows() {
    const rows = [];
    const seen = new Set();
    const named = new Map((state.threads || []).filter(t => t && t.title).map(t => [t.id, t.title]));
    for (const t of state.tasks || []) {
      if (seen.has(t.id)) continue;
      seen.add(t.id);
      rows.push({ id: t.id, title: t.title || named.get(t.id) || '', live: !t.done, updated: t.updated || 0 });
    }
    for (const t of state.threads || []) {
      if (!t || seen.has(t.id)) continue;
      seen.add(t.id);
      rows.push({ id: t.id, title: t.title || '', live: !!t.live, updated: t.updated || 0 });
    }
    rows.sort((a, b) => b.updated - a.updated);
    return rows.slice(0, 10);
  }

  function renderFwTabs() {
    const box = el('fwtabs');
    const rows = tabRows();
    const cur = currentId();
    const sig = rows.map(r => r.id + ':' + r.title + (r.live ? '!' : '')).join('|') + '#' + cur;
    if (sig !== box.dataset.sig) {
      box.dataset.sig = sig;
      box.textContent = '';
      for (const r of rows) {
        const b = document.createElement('button');
        b.className = 'fwtab' + (r.id === cur ? ' on' : '');
        b.dataset.id = r.id;
        b.title = r.title || '';
        if (r.live) b.appendChild(document.createElement('i'));
        const s = document.createElement('span');
        s.textContent = r.title || ('会话 ' + String(r.id).slice(-4));
        b.appendChild(s);
        box.appendChild(b);
      }
      el('fwnew').classList.toggle('on', selectedId === 'new');
      const on = box.querySelector('.fwtab.on');
      if (on) on.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    }
    postDrag();
  }

  function selectTab(id) {
    if (!id) return;
    if (id !== 'new' && !state.tasks.some(t => t.id === id) && !askedThread.has(id)) {
      askedThread.add(id);
      post('thread', { session: id });
    }
    selectedId = id;
    newSince = null;
    el('tail').classList.remove('open');
    el('think-row').classList.remove('open');
    tailSig = '';
    thinkSig = '';
    listSig2 = '';
    if (!pendingImage) el('ask').placeholder = placeholderNow();
    renderFw();
  }

  /** 本轮正在做的那一步（思考 / 工具），没有就是 null。 */
  function currentStep(task) {
    const { msgs, lastUser } = turnOf(task);
    for (let i = msgs.length - 1; i > lastUser; i--) {
      const m = msgs[i];
      if (!isTop(m)) continue;
      if (m.kind === 'assistant') return null;
      if (m.kind === 'think' || m.kind === 'tool') return m;
    }
    return null;
  }

  /** 顶行右侧放计时 / 时间；迷你的状态行说「正在做什么」，标准档列表底部是「深度求索中，用时 X」。 */
  function paintRunning(task) {
    const live = !!(task && !task.done);
    const elapsed = live && task.since ? fmtDuration(Date.now() - task.since) : '';
    let stat = '';
    if (live && task.since) {
      const sec = Math.max(0, Math.round((Date.now() - task.since) / 1000));
      const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, '0');
      stat = h ? h + ':' + String(m).padStart(2, '0') + ':' + ss : m + ':' + ss;
    }
    if (!live && task) {
      const msgs = Array.isArray(task.messages) ? task.messages : [];
      const last = msgs[msgs.length - 1];
      stat = last && last.at ? formatTime(last.at) : '';
    }
    el('fwstat').textContent = stat;

    let cap = '';
    if (selectedId === 'new') cap = newSince ? '正在新建会话…' : '新会话 · 发出第一句后创建';
    else if (selectedId && !task) cap = '正在读取这个会话…';
    else if (live) {
      const step = currentStep(task);
      // 思考有自己那一行，这里只报工具
      cap = step && step.kind === 'tool'
        ? stepName(step) + (step.text ? ' ' + plainText(step.text).slice(0, 80) : '')
        : (step ? '' : '深度求索中');
    }
    if (tier === 1) {
      el('tail-step').textContent = cap;
    } else {
      const run = document.getElementById('m-run-text');
      if (run) run.textContent = '深度求索中' + (elapsed ? '，用时 ' + elapsed : '');
    }
  }

  let thinkSig = '';
  /** 迷你：本轮最新一段思考。 */
  function renderThink(task) {
    const row = el('think-row');
    const { msgs, lastUser } = turnOf(task);
    let think = null;
    if (selectedId !== 'new') {
      for (let i = msgs.length - 1; i > lastUser; i--) {
        const m = msgs[i];
        if (m.kind === 'think' && isTop(m) && m.text) { think = m; break; }
      }
    }
    const open = row.classList.contains('open');
    const sig = currentId() + '|' + (think ? String(think.text).length + (think.live ? 'L' : '') : '') + '|' + (open ? 1 : 0);
    if (sig === thinkSig) return;
    const clip = row.querySelector('.clip');
    const stick = clip.scrollTop + clip.clientHeight >= clip.scrollHeight - 8;
    const first = open && !thinkSig.endsWith('|1');
    thinkSig = sig;
    row.classList.toggle('has', !!think);
    if (!think) { row.classList.remove('open'); return; }
    row.classList.toggle('live', !!think.live);
    row.querySelector('.lab').innerHTML = STEP_ICONS.think + '<span>' + (think.live ? '思考中' : '思考') + '</span>';
    const txt = row.querySelector('.txt');
    txt.textContent = open ? String(think.text) : plainText(think.text);
    clip.classList.remove('over');
    if (!open) clip.classList.toggle('over', txt.scrollWidth > clip.clientWidth + 1);
    else if (first) clip.scrollTop = think.live ? clip.scrollHeight : 0;
    else if (stick && think.live) clip.scrollTop = clip.scrollHeight;
  }

  function renderTail(task) {
    const box = el('tail');
    const text = el('tail-text');
    const live = !!(task && !task.done);
    const answer = selectedId === 'new' ? '' : answerOf(task);
    const open = box.classList.contains('open');
    const sig = currentId() + '|' + answer.length + '|' + (open ? 1 : 0);
    if (sig !== tailSig) {
      const first = !tailSig.endsWith('|1') && open;
      const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
      tailSig = sig;
      if (open) text.innerHTML = formatBody(answer);
      else text.textContent = plainText(answer);
      box.classList.toggle('over', !open && text.scrollHeight > box.clientHeight + 1);
      if (open) {
        // 刚展开：在写就看最新一段，写完了从头读；展开后跟着写的只在本来就停在底部时继续贴底
        if (first) box.scrollTop = live ? box.scrollHeight : 0;
        else if (stick) box.scrollTop = box.scrollHeight;
      }
    }
    paintRunning(task);
  }

  function toggleTail() {
    if (tier !== 1) return;
    const box = el('tail');
    if (!el('tail-text').textContent) return;
    box.classList.toggle('open');
    renderTail(currentTask());
    postFit();
  }

  function stepKey(m) { return m.kind + ':' + (m.at || 0) + ':' + String(m.title || '').slice(0, 16); }

  function renderList(task) {
    const list = el('mlist');
    const msgs = task && Array.isArray(task.messages) ? task.messages : [];
    const sig = currentId() + '#' + msgs.map(m => (m.at || 0) + ':' + String(m.text || m.title || '').length + (m.failed ? 'f' : '')).join('|')
      + '#' + (task && task.done ? 1 : 0) + '#' + [...openSteps].join(',') + '#' + (newSince ? 1 : 0);
    if (sig === listSig2) { paintRunning(task); return; }
    const first = !listSig2;
    listSig2 = sig;
    const stick = list.scrollTop + list.clientHeight >= list.scrollHeight - 12;
    let html = '';
    if (!msgs.length) {
      html = '<div class="m-empty">' + (selectedId === 'new'
        ? (newSince ? '正在新建会话…' : '新会话：在下面输入，发出第一句后创建')
        : selectedId && !task ? '正在读取这个会话…'
        : task ? '这个会话还没有消息' : '还没有会话，直接在下面提问') + '</div>';
    }
    for (const m of msgs) {
      const sub = isTop(m) ? '' : ' sub';
      if (m.kind === 'user') {
        html += '<div class="m-user"><div>' + escapeHtml(m.text || m.title || '') + '</div></div>';
      } else if (m.kind === 'assistant') {
        html += '<div class="m-text' + sub + '">' + formatBody(m.text || m.title || '') + '</div>';
      } else if (m.kind === 'think' || m.kind === 'tool') {
        const key = stepKey(m);
        const open = openSteps.has(key);
        const body = String(m.text || '');
        html += '<div class="m-step' + sub + (open ? ' open' : '') + (m.failed ? ' fail' : '') + '" data-k="' + escapeHtml(key) + '">'
          + '<span class="ic">' + stepIcon(m) + '</span>'
          + '<span class="tx"><b>' + escapeHtml(stepName(m)) + '</b>'
          + (body ? ' · ' + escapeHtml(open ? body : plainText(body)) : '')
          + (m.failed && m.code != null ? ' · 退出码 ' + escapeHtml(m.code) : '') + '</span></div>';
      } else if (m.kind === 'note') {
        html += '<div class="m-note">' + escapeHtml(m.text || m.title || '') + '</div>';
      }
    }
    if (task && !task.done) html += '<div class="m-run"><i></i><span id="m-run-text"></span></div>';
    list.innerHTML = html;
    paintRunning(task);
    if (first || stick) list.scrollTop = list.scrollHeight;
  }

  function renderFw() {
    if (!isFw()) return;
    if (newSince) {
      const fresh = (state.tasks || []).find(t => !newSince.has(t.id));
      if (fresh) { selectedId = fresh.id; newSince = null; }
    }
    const task = currentTask();
    const live = !!(task && !task.done);
    document.body.classList.toggle('running', live);
    syncBusy(live);
    refreshSendMode();
    renderFwTabs();
    if (tier === 1) { renderThink(task); renderTail(task); } else renderList(task);
    if (fwTimer) { clearInterval(fwTimer); fwTimer = 0; }
    if (live || newSince) fwTimer = setInterval(() => paintRunning(currentTask()), 1000);
    postFit();
  }

  /** 迷你档：把卡片的实际高度报给宿主，窗口贴着内容长短。 */
  function postFit() {
    if (tier !== 1) return;
    requestAnimationFrame(() => {
      const h = Math.ceil(el('card').getBoundingClientRect().height);
      if (!h || Math.abs(h - lastFit) < 2) return;
      lastFit = h;
      post('fit', { h });
    });
  }

  /** 标签右边的空白交给原生拖动区：标签自己能点、能左右滑。 */
  function postDrag() {
    requestAnimationFrame(() => {
      const left = Math.ceil(el('fwnew').getBoundingClientRect().right + 4);
      if (left === lastDrag) return;
      lastDrag = left;
      post('dragzone', { left });
    });
  }

  let frame = 0, next = null;
  function render(data) {
    next = data || {};
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      try { paintFrame(next || {}); } finally { renderFw(); }
    });
  }

  function paintFrame(v) {
      if (typeof v.tier === 'number') applyTier(v.tier);
      document.body.classList.toggle('dark', v.theme === 'dark');
      if (typeof v.alpha === 'number') {
        const pct = Math.max(50, Math.min(100, Math.round(v.alpha)));
        document.documentElement.style.setProperty('--alpha', String(pct / 100));
        const slider = el('m-alpha');
        if (slider) slider.value = String(pct);
        const label = el('m-alpha-v');
        if (label) label.textContent = pct + '%';
      }
      setSending(false);
      if (typeof v.notice === 'string' && v.notice) showNotice(v.notice, 7000);
      const threads = Array.isArray(v.threads) ? v.threads : (state.threads || []);
      state.threads = threads;
      fwEmpty = !Array.isArray(v.tasks) || !v.tasks.length;
      if (!Array.isArray(v.tasks) || (!v.tasks.length && !threads.length)) {
        el('list').innerHTML =
          '<div class="empty-state">'
          + '<div class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.37091 11.2501C1.58745 9.89288 1.32067 8.29835 1.61969 6.76006C1.91872 5.22177 2.76342 3.8433 3.99826 2.87846C5.2331 1.91362 6.77494 1.42737 8.33988 1.50925C9.90482 1.59113 11.3875 2.23562 12.5149 3.32406C13.6425 4.41269 14.3387 5.87206 14.4754 7.4334C14.612 8.99474 14.18 10.5529 13.2587 11.8209C12.3375 13.0888 10.9891 13.9813 9.46194 14.3337C8.18691 14.628 6.85895 14.5294 5.64989 14.0605C5.1712 13.8748 4.76962 13.4932 4.26534 13.3967C3.67413 13.2835 2.95257 13.5598 2.03794 14.3337"/><path d="M8 5V11"/><path d="M5 8H11"/></svg></div>'
          + '<b>还没有会话</b>'
          + '<span>直接在下面输入框提问<br>会在 RCHA 里发起对话</span>'
          + '</div>';
        syncBusy(false);
        if (el('goalbar')) el('goalbar').hidden = true;
        const phEmpty = el('perm-head'); if (phEmpty) phEmpty.hidden = true;
        const pcEmpty = el('perm'); if (pcEmpty) pcEmpty.hidden = true;
        const mtEmpty = el('meter'); if (mtEmpty) mtEmpty.hidden = true;
        const trEmpty = el('tabrow'); if (trEmpty) trEmpty.hidden = true;
        el('compose').classList.toggle('compact', el('compose').clientWidth > 0 && el('compose').clientWidth < 460);
        applyHeightTier();
        if (workingTimer) { clearInterval(workingTimer); workingTimer = 0; }
        refreshSendMode();
        el('tabs').hidden = true;
        el('title').textContent = 'RCHA';
        return;
      }
      state = {
        tasks: (v.tasks || []).slice(0, 8),
        active: v.active || (v.tasks && v.tasks[0] ? v.tasks[0].id : '') || (threads[0] ? threads[0].id : ''),
        models: Array.isArray(v.models) ? v.models : [],
        commands: Array.isArray(v.commands) ? v.commands : (state.commands || []),
        threads,
      };
      syncBusy(state.tasks.some(t => !t.done));
      const tr = el('tabrow'); if (tr) tr.hidden = false;
      renderTabs();

      const task = activeTask();
      if (!task) {
        if (state.active) showThreadStub(state.active);
        return;
      }
      if (task.id) lastSession = String(task.id);
      const modelMenu = el('model-menu');
      if (!modelMenu.hidden && state.models.length) { buildModelMenu(); placeModelMenu(); }
      el('title').textContent = task.title || 'RCHA';
      el('compose').classList.toggle('compact', el('compose').clientWidth > 0 && el('compose').clientWidth < 460);
      applyHeightTier();
      refreshSendMode();
      renderUsage(task.usage);
      state.modelName = task.model ? String(task.model) : (state.modelName || '');
      if (Array.isArray(task.commands)) state.commands = task.commands;
      state.files = v.files || state.files || null;
      const atMenu = el('at-menu');
      if (atMenu && !atMenu.hidden) updateAtMenu();
      state.permission = task.permission || state.permission || null;
      renderPermission();
      renderGoal(task);
      if (task.model && el('model-name')) {
        el('model-name').textContent = String(task.model).slice(0, 18);
      }
      const st = task.stats;
      const stats = el('stats');
      const hideStats = document.body.classList.contains('hide-usage');
      if (st && !hideStats && (st.turns || st.steps || st.total)) {
        el('st-ico-left').innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6"/><path d="M8 2v3"/></svg>';
        el('st-ico-right').innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><ellipse cx="8" cy="4.5" rx="5.5" ry="2"/><path d="M2.5 4.5v7c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2v-7"/></svg>';
        el('st-left').textContent = (st.turns || 0) + ' 轮 ' + (st.steps || 0) + ' 步'
          + (st.tps ? ' · ' + st.tps + ' tok/s' : '');
        const parts = [];
        if (st.total) parts.push(shortK(st.total) + ' tok');
        if (st.cacheHit != null) parts.push('缓存命中 ' + st.cacheHit + '%');
        el('st-right').textContent = parts.join(' · ');
        stats.hidden = false;
      } else {
        stats.hidden = true;
      }
      const count = state.tasks.length;

      // 消息列表：按 id 集合重建，展开状态保留
      const msgs = Array.isArray(task.messages) ? task.messages : [];
      const listSig = task.id + '#' + msgs.map(m => (m.at || 0) + (m.title || '')).join('|');
      const list = el('list');
      if (listSig !== list.dataset.sig) {
        list.dataset.sig = listSig;
        list.textContent = '';
        if (!msgs.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '等待消息…';
          list.appendChild(empty);
        }
        const groups = groupMessages(msgs);
        groups.forEach((group, gi) => {
          if (group.kind === 'process') {
            list.appendChild(buildProcessRow(group, task, gi, gi === groups.length - 1));
            return;
          }
          const m = group.m;
          const item = buildMessageRow(m, task, group.index);
          if (item) list.appendChild(item);
        });
        if (!task.done) {
          const working = document.createElement('div');
          working.className = 'working';
          const dots = document.createElement('span');
          dots.className = 'dots';
          for (let i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
          const label = document.createElement('span');
          label.textContent = '深度求索中，用时 0 秒';
          working.append(dots, label);
          list.appendChild(working);
          startWorkingClock(label, task.since);
        }
        list.scrollTop = list.scrollHeight;
        // 没被截断的行不需要展开箭头
        requestAnimationFrame(() => {
          list.querySelectorAll('.msg').forEach(node => {
            if (node.classList.contains('open') || node.classList.contains('process')) return;
            const body = node.querySelector(':scope > .msg-body');
            const chev = node.querySelector(':scope > .msg-head .msg-chev');
            if (!body || !chev || body.style.display === 'none') return;
            chev.style.visibility = body.scrollHeight > body.clientHeight + 2 ? '' : 'hidden';
          });
        });
      }

      const confirm = v.confirm;
      if (confirm && confirm.hint) {
        el('hint').textContent = confirm.hint;
        el('actions').hidden = false;
      } else el('actions').hidden = true;

      post('resize', {});
  }

  const ask = el('ask');
  ask.addEventListener('focus', () => { post('focus', { value: true }); });
  ask.addEventListener('blur', () => { post('focus', { value: false }); });

  /** 标签行列出全部对话（有消息的在最前，其余按更新时间）。 */
  function renderTabs() {
    const tabs = el('tabs');
    if (!tabs) return;
    const rows = state.threads.length
      ? state.threads.map(t => ({ id: t.id, title: t.title || '', live: !!t.live }))
      : state.tasks.map(t => ({ id: t.id, title: t.title || '', live: !t.done }));
    const seen = new Set();
    const ready = rows.filter(t => (seen.has(t.id) ? false : seen.add(t.id)));
    const sig = ready.map(t => t.id + ':' + (t.title || '') + (t.live ? '!' : '')).join('|') + '#' + state.active;
    if (sig === tabs.dataset.sig) {
      tabs.hidden = ready.length <= 1;
      return;
    }
    tabs.dataset.sig = sig;
    tabs.textContent = '';
    tabs.hidden = ready.length <= 1;
    for (const t of ready.slice(0, 16)) {
      const b = document.createElement('button');
      b.className = 'tab' + (t.id === state.active ? ' active' : '') + (t.live ? ' live' : '');
      b.textContent = t.title || '会话 ' + String(t.id).slice(-4);
      onTap(b, e => {
        e.stopPropagation();
        state.active = t.id;
        tabs.dataset.sig = '';
        signature = '';
        openId = '';
        render(state);
        post('activity', {});
      });
      tabs.appendChild(b);
    }
  }


  /** 把消息切成「单条」与「过程组」：连续的思考/工具调用并成一组（dsh 的 TurnProcess）。 */
  function groupMessages(msgs) {
    const groups = [];
    msgs.forEach((m, index) => {
      const isStep = m.kind === 'tool' || m.kind === 'think';
      if (isStep) {
        const last = groups[groups.length - 1];
        if (last && last.kind === 'process') last.items.push(m);
        else groups.push({ kind: 'process', items: [m] });
      } else {
        groups.push({ kind: 'msg', m, index });
      }
    });
    return groups;
  }

  /** 过程组摘要：dsh 的「{n} 次工具调用 · {n} 条消息 · 已思考」。 */
  function processSummary(items) {
    const tools = items.filter(m => m.kind === 'tool').length;
    const thoughts = items.filter(m => m.kind === 'think').length;
    const parts = [];
    if (tools) parts.push(tools + ' 次工具调用');
    if (thoughts) parts.push('已思考');
    return parts.join(' · ') || '过程';
  }

  const CHEV_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L7.29289 9.29289C7.68342 9.68342 8.31658 9.68342 8.70711 9.29289L12 6"/></svg>';

  /** 过程组：一行摘要（33 高、0.5 底边），点开是逐条步骤。 */
  function buildProcessRow(group, task, gi, isLast) {
    const wrap = document.createElement('div');
    wrap.className = 'msg process';
    wrap.dataset.id = task.id + ':p' + gi;
    // 正在跑的这一轮默认展开，能直接看到当前步骤；跑完自动收起
    const running = !task.done && isLast;
    const open = !!(wrap.dataset.id === openId) || (!openId && running);
    if (open) wrap.classList.add('open');

    const head = document.createElement('div');
    head.className = 'msg-head process-head';

    const body = document.createElement('div');
    body.className = 'process-body';
    group.items.forEach((m, i) => {
      const row = buildMessageRow(m, task, 'p' + gi + '-' + i);
      if (row) body.appendChild(row);
    });

    onTap(head, e => {
      e.stopPropagation();

      wrap.classList.toggle('open', !wasOpen);
      openId = wasOpen ? '' : wrap.dataset.id;
      post('activity', {});
      post('resize', {});

    wrap.append(head, body);
    return wrap;

  /** 单条消息行：用户气泡 / 回复正文 / 用时提示。 */
  function buildMessageRow(m, task, index) {
    const kind = m.kind === 'tool' ? 'tool'
      : m.kind === 'user' ? 'user'
        : m.kind === 'think' ? 'think'
          : m.kind === 'note' ? 'note' : 'assistant';
    const item = document.createElement('div');
    item.className = 'msg ' + kind;
    item.dataset.id = task.id + ':' + index;
    if (m.depth) item.style.marginLeft = (m.depth * 14) + 'px';
    if (kind === 'note') {
      item.appendChild(Object.assign(document.createElement('div'), {
        className: 'msg-note',
        textContent: m.text || m.title || '',
      }));
      return item;
    }
    if (kind === 'assistant' || kind === 'user') item.classList.add('no-title');
    const trace = document.body.classList.contains('trace');
    if (trace && (kind === 'assistant' || kind === 'user')) item.classList.add('condensed');

    const head = document.createElement('div');
    head.className = 'msg-head';
    const badge = document.createElement('span');
    badge.className = 'badge';
    const icon = document.createElement('span');
    icon.className = 'step-ico';
    const isStep = kind === 'tool' || kind === 'think';
    if (isStep) {
      icon.innerHTML = stepIcon(m);
      item.classList.add('step');
    }
    const title = document.createElement('span');
    title.className = 'msg-title';
    if (trace && (kind === 'assistant' || kind === 'user')) {
      const raw = String(m.text || m.title || '').trim().split('\n')[0];
      // 压成一行时去掉 markdown 标记（## / - / ** / `），否则会显示成「## 编译结果」
      const text = raw.replace(/^#{1,6}\s*/, '').replace(/^[-*+]\s+/, '').replace(/[*`]/g, '').trim();
      title.textContent = (kind === 'user' ? '提问' : '回复') + (text ? ' · ' + text : '');
    } else if (kind === 'tool' || kind === 'think') {
      const base = m.title || (kind === 'think' ? '思考' : '工具调用');
      const withCount = m.count > 1 ? base + ' ×' + m.count : base;
      const first = String(m.text || '').trim().split('\n')[0];
      if (!first) title.textContent = withCount;
      else title.innerHTML = inlineMarkdown(escapeHtml(withCount)) + ' · ' + inlineMarkdown(escapeHtml(first));
    }
    let errBadge = null;
    if (isStep && (m.failed || m.code !== undefined)) {
      errBadge = document.createElement('span');
      errBadge.className = 'step-err';
      errBadge.textContent = m.code !== undefined ? '退出码 ' + m.code : '失败';
    }
    const chev = document.createElement('span');
    chev.className = 'msg-chev';
    chev.innerHTML = CHEV_SVG;
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = formatTime(m.at);
    head.append(isStep ? icon : badge, title);
    if (errBadge) head.append(errBadge);
    head.append(time, chev);

    const body = document.createElement('div');
    body.className = 'msg-body';
    const text = String(m.text || (kind === 'user' ? m.title : '') || '');
    body.innerHTML = formatBody(text);
    if (!text.trim()) {
      body.style.display = 'none';
      chev.style.visibility = 'hidden';
    }

    onTap(head, e => {
      e.stopPropagation();
      const wasOpen = item.classList.contains('open');
      document.querySelectorAll('#list .msg.open').forEach(n => n.classList.remove('open'));
      if (!wasOpen) {
        item.classList.add('open');
        openId = item.dataset.id;
      } else {
        openId = '';
      }
      post('activity', {});
      post('resize', {});
    });

    item.append(head, body);
    return item;
  }

  /** 本地回显：先把用户这句放到列表里，等真实数据到达时整块重绘。 */
  function appendEcho(text, hasAttachment) {
    if (isFw()) {

  function sendText() {
    const typed = (ask.value || '').trim();
    const image = pendingImage;
    const file = pendingFile;
    if (!typed && !image && !file) return;
    const text = typed;
    const task = isFw() ? currentTask() : activeTask();
    // 状态可能还没送到（或只有旧的任务 id）：把最近一次已知的会话 id 带上，
    // 插件侧还会再按「最近活跃会话」兜底，所以空串也能投递。
    let session = (task && task.id) || (isFw() ? currentId() : '') || state.active || lastSession || '';
    if (isFw() && selectedId === 'new') {
      session = 'new';
      newSince = new Set((state.tasks || []).map(t => t.id).concat((state.threads || []).map(t => t.id)));
    }
    pendingImage = '';
    pendingFile = '';

    if (el('cmd-menu')) el('cmd-menu').hidden = true;
    appendEcho(text, !!(image || file));
    if (!session) {
      // 完全不知道投给谁：请宿主重新读状态，并说明正在做什么
      post('refresh', {});
      post('threads', {});
      showNotice('正在唤起 RCHA 会话…', 5000, true);
    } else {
      showNotice('', 0);
    }
    refreshSendMode();

  const VOICE_BARS = 28;
  let voiceWave = [];
  let voiceErrTimer = 0;
  function voiceUi(state, message) {
    const bar = el('voicebar');
    const b = document.body;
    clearTimeout(voiceErrTimer);
    if (state === 'idle' || !state) {
      b.classList.remove('voice-on');

      wave.innerHTML = '';
      for (let i = 0; i < VOICE_BARS; i++) wave.appendChild(document.createElement('i'));
    } else if (state === 'transcribing') {
      lab.textContent = '识别中…';
    } else if (state === 'error') {
      lab.textContent = message || '没听清，再说一次';
      lab.title = lab.textContent;
      voiceErrTimer = setTimeout(() => voiceUi('idle'), 3200);

  function voiceLevel(level, ms, loud, spoke) {
    const bar = el('voicebar');
    if (bar.dataset.s !== 'listening' || !document.body.classList.contains('voice-on')) return;
    const s = Math.floor((ms || 0) / 1000);
    bar.querySelector('.vtime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    bar.querySelector('.vlab').textContent = !spoke ? '请说话' : (loud ? '正在听' : '停顿后自动结束');
    voiceWave.push({ v: Math.max(0, Math.min(1, +level || 0)), on: !!loud });
    if (voiceWave.length > VOICE_BARS) voiceWave.shift();
    const bars = bar.querySelectorAll('.vwave i');
    const off = bars.length - voiceWave.length;
    bars.forEach((node, i) => {
      const item = voiceWave[i - off];
      node.style.height = item ? Math.max(2, Math.round(2 + item.v * 16)) + 'px' : '2px';
      node.classList.toggle('on', !!(item && item.on));
    });
  }

  const STEP_ICONS = {
    think: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M10.2854 5.71481C12.9673 8.39663 14.1182 11.5938 12.8562 12.8559C11.5942 14.1179 8.39706 12.9669 5.71518 10.2851C3.03333 7.60323 1.88236 4.40608 3.14441 3.14403C4.40644 1.882 7.6036 3.03297 10.2854 5.71481Z"/><path d="M10.2854 10.2851C7.6036 12.9669 4.40644 14.1179 3.14441 12.8559C1.88236 11.5938 3.03333 8.39663 5.71518 5.71481C8.39706 3.03297 11.5942 1.882 12.8562 3.14403C14.1182 4.40608 12.9673 7.60323 10.2854 10.2851Z"/></svg>',

  /** 工具行按名称挑一个 dsh 轨迹里的图标。 */
  function stepIcon(m) {
    const name = String(m.title || '');
    if (m.kind === 'think') return STEP_ICONS.think;
    if (/搜索|grep|search/i.test(name)) return STEP_ICONS.search;
    if (/执行|命令|command|shell/i.test(name)) return STEP_ICONS.command;
    return STEP_ICONS.file;
  }

  const AT_FILE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9.5 1.5H4.5C3.7 1.5 3 2.2 3 3V13C3 13.8 3.7 14.5 4.5 14.5H11.5C12.3 14.5 13 13.8 13 13V5L9.5 1.5Z"/><path d="M9.5 1.5V5H13"/></svg>';
  const AT_DIR = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 4.5C1.5 3.7 2.2 3 3 3H6L7.5 5H13C13.8 5 14.5 5.7 14.5 6.5V12C14.5 12.8 13.8 13.5 13 13.5H3C2.2 13.5 1.5 12.8 1.5 12V4.5Z"/></svg>';

  /** 光标前是否处在一个 @ 引用里（规则照 dsh file-reference/grammar.ts 的 activeAtToken）。 */
  function activeAtToken() {
    const box = el('ask');
    const caret = typeof box.selectionStart === 'number' ? box.selectionStart : String(box.value).length;
    const before = String(box.value).slice(0, caret);
    const quoted = /(?:^|\s)(@"([^"]*))$/.exec(before);
    if (quoted) return { prefix: quoted[1], query: quoted[2], quoted: true, caret };
    const plain = /(?:^|\s)(@([^\s]*))$/.exec(before);
    if (!plain) return null;
    return { prefix: plain[1], query: plain[2], quoted: false, caret };
  }

  let atTimer = 0;
  let atPending = '';
  function updateAtMenu() {
    const menu = el('at-menu');
    if (!menu) return;
    const token = activeAtToken();
    if (!token) { menu.hidden = true; return; }
    const result = state.files;
    if (!result || result.query !== token.query) {
      // 查询变了：请宿主补一次候选，等结果回来再画
      if (atPending !== token.query) {
        atPending = token.query;
        clearTimeout(atTimer);
        atTimer = setTimeout(() => {
          post('files', { session: state.active || lastSession || '', query: token.query });
        }, 160);
      }
    }
    const items = result && result.query === token.query ? (result.items || []) : [];
    if (!items.length) {
      if (result && result.query === token.query) {
        menu.textContent = '没有匹配的文件';
        menu.className = 'tip';
        menu.hidden = false;
        placeCommandMenu();
      } else {
        menu.hidden = true;
      }
      return;
    }
    menu.className = '';
    menu.textContent = '';
    items.forEach((item, i) => {
      const b = document.createElement('button');
      if (i === 0) b.className = 'on';
      const icon = document.createElement('span');
      icon.className = 'afile';
      icon.innerHTML = item.k === 'directory' ? AT_DIR : AT_FILE;
      const path = document.createElement('span');
      path.className = 'apath';
      path.textContent = item.p;
      b.append(icon, path);
      onTap(b, ev => {
        ev.stopPropagation();
        const box = el('ask');
        const value = String(box.value);
        const start = box.selectionStart === null ? value.length : box.selectionStart;
        const before = value.slice(0, start).replace(new RegExp(token.prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'), '');
        const after = value.slice(start);
        // 含空格要用 dsh 的 @"…" 语法；目录选完停在目录里继续补全
        const text = /\s/.test(item.p) ? '@"' + item.p + '"' : '@' + item.p;
        const tail = item.k === 'directory' ? '' : ' ';
        box.value = before + text + tail + after;
        menu.hidden = true;
        atPending = '';
        growAsk();
        post('focus', { value: true });
        box.focus();
      });
      menu.appendChild(b);
    });
    menu.hidden = false;
    placeCommandMenu();
  }

  /** / 指令菜单：输入以 / 开头且还没空格时列出可用命令（dsh 的 popupSelect）。 */
  function updateCommandMenu() {
    const menu = el('cmd-menu');
    if (!menu) return;
    const text = String(el('ask').value || '');
    if (!text.startsWith('/') || /\s/.test(text)) { menu.hidden = true; return; }
    const query = text.slice(1).toLowerCase();
    const list = (state.commands || []).filter(c => String(c.n || '').toLowerCase().startsWith(query)).slice(0, 12);
    if (!list.length) {
      if ((state.commands || []).length === 0) {
        menu.textContent = '没有可用的指令';
        menu.className = 'tip';
        menu.hidden = false;
        placeCommandMenu();
      } else {
        menu.hidden = true;
      }
      return;
    }
    menu.className = '';
    menu.textContent = '';
    list.forEach((c, i) => {
      const b = document.createElement('button');
      if (i === 0) b.className = 'on';
      const name = document.createElement('span');
      name.className = 'cname';
      name.textContent = '/' + c.n;
      const desc = document.createElement('span');
      desc.className = 'cdesc';
      desc.textContent = c.d || '';
      b.append(name, desc);
      onTap(b, ev => {
        ev.stopPropagation();
        menu.hidden = true;
        el('ask').value = '/' + c.n + ' ';
        try { el('ask').style.height = '36px'; } catch (_) {}
        growAsk();
        post('focus', { value: true });
        el('ask').focus();
      });
      menu.appendChild(b);
    });
    menu.hidden = false;
    placeCommandMenu();
  }

  function placeCommandMenu() {
    const menu = el('cmd-menu');
    const compose = el('compose');
    if (!menu || !compose) return;
    const goal = el('goalbar');
    const dock = el('dock');
    const extra = goal && !goal.hidden ? goal.offsetHeight + 6 : 0;
    const foot = dock && !dock.hidden ? dock.offsetHeight : 0;
    menu.style.bottom = (compose.offsetHeight + extra + foot + 6) + 'px';
  }

  /** 目标条图标：dsh GoalBar 用的 goal/pause/play/trash 原稿。 */
  const GOAL_GLYPHS = {
    goal: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M14.5001 8C14.5 9.28552 14.1188 10.5422 13.4045 11.611C12.6903 12.6799 11.6752 13.5129 10.4875 14.0049C9.29982 14.4968 7.99295 14.6255 6.73212 14.3747C5.4713 14.124 4.31314 13.505 3.4041 12.596C2.49514 11.687 1.87614 10.5288 1.62537 9.26798C1.37459 8.00716 1.50331 6.70028 1.99525 5.51261C2.48719 4.32494 3.32025 3.30981 4.3891 2.59557C5.45795 1.88134 6.71458 1.50008 8.0001 1.5" stroke="currentColor"/><path d="M11.5 8C11.5001 8.69227 11.2948 9.36901 10.9102 9.94463C10.5257 10.5202 9.97901 10.9689 9.33944 11.2338C8.69986 11.4987 7.99609 11.5681 7.31712 11.433C6.63816 11.2979 6.01449 10.9645 5.52501 10.475C5.03548 9.98552 4.70209 9.36185 4.56702 8.68289C4.43195 8.00392 4.50127 7.30015 4.76619 6.66057C5.03112 6.021 5.47976 5.47436 6.05538 5.08978C6.631 4.70519 7.30774 4.49995 8.00001 4.5" stroke="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 14.5C11.5899 14.5 14.5 11.5899 14.5 8C14.5 4.41015 11.5899 1.5 8 1.5C4.41015 1.5 1.5 4.41015 1.5 8C1.5 11.5899 4.41015 14.5 8 14.5Z"/><path d="M6.5 5V11"/><path d="M9.5 5V11"/></svg>',
    play: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 14.5C11.5899 14.5 14.5 11.5899 14.5 8C14.5 4.41015 11.5899 1.5 8 1.5C4.41015 1.5 1.5 4.41015 1.5 8C1.5 11.5899 4.41015 14.5 8 14.5Z"/><path d="M10.3329 7.91346C10.3996 7.95195 10.3996 8.04818 10.3329 8.08667L6.78304 10.1362C6.71638 10.1747 6.63304 10.1266 6.63304 10.0496L6.63304 5.95055C6.63304 5.87357 6.71638 5.82546 6.78304 5.86395L10.3329 7.91346Z"/></svg>',
    trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.28149 3.88831H14.7187"/><path d="M5.41602 3.88833V2.47962C5.41602 2.29282 5.52492 2.11366 5.71876 1.98157C5.9126 1.84948 6.17551 1.77527 6.44964 1.77527H9.55053C9.82466 1.77527 10.0876 1.84948 10.2814 1.98157C10.4753 2.11366 10.5842 2.29282 10.5842 2.47962V3.88833"/><path d="M2.57349 3.88831L3.19366 13.2943C3.21937 13.5502 3.33952 13.7872 3.53065 13.9593C3.72178 14.1313 3.97016 14.2259 4.22729 14.2246H11.7728C12.0299 14.2259 12.2783 14.1313 12.4694 13.9593C12.6605 13.7872 12.7807 13.5502 12.8064 13.2943L13.4266 3.88831"/><path d="M6.44946 6.98926V11.1238"/><path d="M9.55054 6.98926V11.1238"/></svg>',
  };

  /** 目标条：阶段文案 + 目标正文 + 暂停/恢复 + 清除（dsh GoalBar）。 */
  function renderGoal(task) {
    const bar = el('goalbar');
    if (!bar) return;
    const goal = task && task.goal;
    if (!goal || !goal.phase) { bar.hidden = true; return; }
    const labels = {
      active: goal.activation === 'disarmed' ? '待继续的目标' : '进行中的目标',
      paused: '已暂停的目标',
      blocked: '受阻的目标',
    };
    el('goal-label').textContent = labels[goal.phase] || '进行中的目标';
    el('goal-obj').textContent = goal.objective || '';
    el('goal-glyph').innerHTML = GOAL_GLYPHS.goal;
    const toggle = el('goal-toggle');
    const running = goal.phase === 'active' && goal.activation !== 'disarmed';
    toggle.innerHTML = running ? GOAL_GLYPHS.pause : GOAL_GLYPHS.play;
    toggle.title = running ? '暂停目标' : '恢复目标';
    el('goal-clear').innerHTML = GOAL_GLYPHS.trash;
    el('goal-clear').title = '清除目标';
    bar.hidden = false;
  }

  /** 权限胶囊：图标 + 中文名（dsh PermissionSelect 的 trigger）。 */
  function renderPermission() {
    const info = state.permission;
    const glyph = el('perm-glyph');
    const name = el('perm-name');
    const chip = el('perm');
    if (!info || !info.current || !glyph || !name) {
      if (chip) chip.hidden = true;
      return;
    }
    chip.hidden = false;
    const value = String(info.current);
    glyph.innerHTML = PERM_GLYPHS[value] || PERM_GLYPHS['read-only'];
    name.textContent = PERM_LABELS[value] || value;
    chip.title = '权限：' + (PERM_LABELS[value] || value);
    // 顶栏那枚（dsh 的「标准模式」位置）
    const headChip = el('perm-head');
    if (headChip) {
      headChip.hidden = false;
      el('perm-head-glyph').innerHTML = PERM_GLYPHS[value] || PERM_GLYPHS['read-only'];
      el('perm-head-name').textContent = PERM_LABELS[value] || value;
      headChip.title = '权限：' + (PERM_LABELS[value] || value);
    }
  }

  let riskyPending = 0;
  /** 权限菜单：行 = 图标 + 名称 + 当前勾选；完全权限/自动审查要再点一次确认。 */
  function buildPermMenu() {
    const menu = el('perm-menu');
    const info = state.permission;
    if (!menu || !info || !info.options || !info.options.length) return false;
    menu.textContent = '';
    const values = PERM_ORDER.filter(v => info.options.includes(v));
    for (const v of info.options) if (!values.includes(v)) values.push(v);
    for (const value of values) {
      const b = document.createElement('button');
      const icon = document.createElement('span');
      icon.className = 'pglyph';
      icon.innerHTML = PERM_GLYPHS[value] || PERM_GLYPHS['read-only'];
      const label = document.createElement('span');
      label.className = 'pname';
      label.textContent = PERM_LABELS[value] || value;
      b.append(icon, label);
      const check = document.createElement('span');
      check.className = 'mcheck';
      if (value === info.current) {
        b.className = 'on';
        check.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5L6.5 12L13 4.5"/></svg>';
      }
      b.appendChild(check);
      onTap(b, ev => {
        ev.stopPropagation();
        if (value === info.current) { menu.hidden = true; return; }
        if (PERM_RISKY[value] && Date.now() > riskyPending) {
          // dsh 对这两个预设要一次显式确认；这里用「再点一次」代替弹窗
          riskyPending = Date.now() + 5000;
          showNotice('再点一次确认启用「' + (PERM_LABELS[value] || value) + '」', 5000);
          return;
        }
        riskyPending = 0;
        menu.hidden = true;
        el('perm').setAttribute('aria-expanded', 'false');
        post('permission', { session: state.active || lastSession || '', value });
        showNotice('已请求切换到「' + (PERM_LABELS[value] || value) + '」', 3000, true);
      });
      menu.appendChild(b);
    }
    return true;
  }

  /** 上下文面板贴着 dock 上沿（dsh 的 panel 是浮层，不能压住输入栏）。 */
  function placeUsagePanel() {
    const card = el('usage-card');
    const compose = el('compose');
    const dock = el('dock');
    if (!card || !compose) return;
    const foot = dock && !dock.hidden ? dock.offsetHeight : 0;
    card.style.bottom = (compose.offsetHeight + foot + 8) + 'px';
  }

  /** 菜单贴着输入栏上沿：输入框长高了、或者下面弹出提示条，都不能压住内容。 */
  function placeModelMenu() {
    const menu = el('model-menu');
    const compose = el('compose');
    const box = el('notice');
    if (!menu || !compose) return;
    const extra = box && !box.hidden ? box.offsetHeight + 8 : 0;
    const dock = el('dock');
    const foot = dock && !dock.hidden ? dock.offsetHeight : 0;
    menu.style.bottom = (compose.offsetHeight + extra + foot + 8) + 'px';
  }

  function buildModelMenu() {
    const menu = el('model-menu');
    if (!state.models || !state.models.length) return false;
    menu.textContent = '';
    state.models.forEach(m => {
      const b = document.createElement('button');
      const name = document.createElement('span');
      name.className = 'mname';
      name.textContent = m.name || m.id;
      b.appendChild(name);
      const check = document.createElement('span');
      check.className = 'mcheck';
      const picked = m.name === state.modelName || (state.modelName && String(m.id) === String(state.modelName));
      if (picked) {
        b.className = 'on';
        check.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5L6.5 12L13 4.5"/></svg>';
      }
      b.appendChild(check);
      onTap(b, ev => {
        ev.stopPropagation();
        menu.hidden = true;
        post('model', { session: (activeTask() || {}).id || lastSession || '', provider: m.provider, model: m.id });
      });
      menu.appendChild(b);
    });
    return true;
  }

  onTap(el('use-dsh'), e => {
    e.stopPropagation();
    post('ui', { value: 'dsh' });
  });

  onTap(el('view-chat'), e => { e.stopPropagation(); setView('chat', true); });
  onTap(el('view-trace'), e => { e.stopPropagation(); setView('trace', true); });

  onTap(el('folder'), e => {
    e.stopPropagation();
    post('open', {});
  });

  onTap(el('goal-toggle'), e => {
    e.stopPropagation();
    const task = activeTask();
    const goal = task && task.goal;
    if (!goal) return;
    const running = goal.phase === 'active' && goal.activation !== 'disarmed';
    post('goal', { session: state.active || lastSession || '', value: running ? 'pause' : 'resume' });
    showNotice(running ? '已请求暂停目标' : '已请求恢复目标', 3000, true);
  });

  onTap(el('goal-clear'), e => {
    e.stopPropagation();
    const task = activeTask();
    if (!task || !task.goal) return;
    post('goal', { session: state.active || lastSession || '', value: 'clear' });
    showNotice('已请求清除目标', 3000, true);
  });

  onTap(el('perm-head'), e => {
    e.stopPropagation();
    const menu = el('perm-menu');
    if (!menu.hidden) {
      menu.hidden = true;
      el('perm-head').setAttribute('aria-expanded', 'false');
      return;
    }
    if (!buildPermMenu()) { el('perm-head').hidden = true; return; }
    menu.style.bottom = '';
    menu.style.top = (el('head').offsetHeight + 2) + 'px';
    menu.hidden = false;
    el('perm-head').setAttribute('aria-expanded', 'true');
  });

  onTap(el('perm'), e => {
    e.stopPropagation();
    const menu = el('perm-menu');
    if (!menu.hidden) {
      menu.hidden = true;
      el('perm').setAttribute('aria-expanded', 'false');
      return;
    }
    if (!buildPermMenu()) {
      // 权限数据还没到：把胶囊藏起来，别显示一个点不动的假按钮
      el('perm').hidden = true;
      return;
    }
    const compose = el('compose');
    const dock = el('dock');
    const foot = dock && !dock.hidden ? dock.offsetHeight : 0;
    menu.style.bottom = (compose.offsetHeight + foot + 8) + 'px';
    menu.hidden = false;
    el('perm').setAttribute('aria-expanded', 'true');
  });

  onTap(el('model'), e => {
    e.stopPropagation();
    const menu = el('model-menu');
    if (!menu.hidden) { menu.hidden = true; return; }
    menu.classList.remove('tip');
    if (buildModelMenu()) {
      placeModelMenu();
      menu.hidden = false;
      return;
    }
    // 清单还没拿到（插件刚起来 / 服务晚挂载）：请一次，别让按钮点了没反应
    menu.textContent = '正在获取模型清单…';
    menu.classList.add('tip');
    placeModelMenu();
    menu.hidden = false;
    post('models', {});
  });

  onTap(el('thumb-x'), e => {
    e.stopPropagation();
    pendingImage = '';
    pendingFile = '';
    el('attach-bar').hidden = true;
    el('file-chip').hidden = true;
    el('file-name').textContent = '';
    el('thumb-img').removeAttribute('src');
    el('ask').placeholder = '问点什么…';
  });
  function growAsk() {
    ask.style.height = 'auto';
    const mini = isFw();
    ask.style.height = Math.min(mini ? 64 : 84, Math.max(mini ? 28 : 36, ask.scrollHeight)) + 'px';
    postFit();
    refreshSendMode();
    updateCommandMenu();
    updateAtMenu();
  }
  ask.addEventListener('input', growAsk);

  ask.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendText(); }
  });

  document.addEventListener('click', e => {
    const card = el('usage-card');
    if (!card.hidden && !card.contains(e.target) && !e.target.closest('#meter')) {
      card.hidden = true;
      el('meter').setAttribute('aria-expanded', 'false');
    }
    const menu = el('model-menu');
    if (!menu.hidden && !menu.contains(e.target) && e.target.id !== 'model' && !e.target.closest('#model')) {
      menu.hidden = true;
    }
    const atMenu = el('at-menu');
    if (atMenu && !atMenu.hidden && !atMenu.contains(e.target)) atMenu.hidden = true;
    const cmdMenu = el('cmd-menu');
    if (cmdMenu && !cmdMenu.hidden && !cmdMenu.contains(e.target)) cmdMenu.hidden = true;
    const permMenu = el('perm-menu');
    if (!permMenu.hidden && !permMenu.contains(e.target) && !e.target.closest('#perm') && !e.target.closest('#perm-head')) {
      permMenu.hidden = true;
      el('perm').setAttribute('aria-expanded', 'false');
    }
  });

  onTap(el('allow'), () => { post('activity', {}); post('confirm', { allow: true }); });
  onTap(el('deny'), () => { post('activity', {}); post('confirm', { allow: false }); });

  try {
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(() => { applyHeightTier(); postFit(); }).observe(el('card'));
    }
  } catch (_) {}
  try {
    setView(localStorage.getItem('floatwin_view') === 'trace' ? 'trace' : 'chat', false);
  } catch (_) {}
  applyTier(1);
  post('ready', {});
  // 宿主在页面加载前推的那一帧会丢：主动请它再读一次状态文件。
  post('refresh', {});
  // 再请一次会话清单，保证「所有对话」都能列出来
  post('threads', {});
})();
</script>
</body>
</html>
