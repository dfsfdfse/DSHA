<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCHA</title>
<style>
  :root {
    --bg-rgb: 17, 20, 26;
    --alpha: .6;
    --fg: #f2f4f8;
    --muted: rgba(242, 244, 248, .55);
    --line: rgba(255, 255, 255, .09);
    --accent: #7aa2ff;
    --danger: #ff6b5e;
    --ok: #46c37b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font: 13px/1.5 -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #card {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(var(--bg-rgb), var(--alpha));
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 8px 12px 8px;
    overflow: hidden;
  }
  /* 唯一的拖动区：与原生触摸带等高 */
  #head {
    height: 22px;
    display: flex; align-items: center; gap: 6px;
    overflow: hidden;
  }
  #dot { width: 6px; height: 6px; background: var(--accent); flex: 0 0 auto; }
  #title {
    font-size: 11.5px; color: var(--muted); flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #count {
    font-size: 10px; color: var(--muted); flex: 0 0 auto;
    border-left: 1px solid var(--line); padding-left: 6px;
  }
  #count[hidden] { display: none; }

  #tabs {
    display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
    margin: 4px 0 6px; padding-bottom: 2px; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs[hidden] { display: none; }
  .tab {
    flex: 0 0 auto; max-width: 140px;
    font-size: 11px; line-height: 16px; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active { color: #cfe0ff; border-color: rgba(122,162,255,.65); background: rgba(122,162,255,.16); }

  /* 消息列表：填满剩余高度并滚动，样式对齐聊天记录 */
  #list {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    border-top: 1px solid var(--line); margin-top: 2px;
  }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); }
  #list::-webkit-scrollbar-track { background: transparent; }
  .empty { color: var(--muted); font-size: 12px; padding: 10px 0; }

  .msg { border-bottom: 1px solid rgba(255,255,255,.05); }
  .msg:last-child { border-bottom: none; }
  .msg-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 0 7px 2px; cursor: pointer;
  }
  .badge {
    flex: 0 0 auto; width: 4px; height: 4px; margin-top: 7px;
    background: var(--accent);
  }
  .msg.tool .badge { background: #ffcf7a; }
  .msg-title {
    flex: 1 1 auto; min-width: 0;
    font-size: 12.5px; line-height: 18px; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .msg.open .msg-title { white-space: normal; }
  .msg-body {
    max-height: 0; overflow: hidden; transition: max-height .16s ease;
    font-size: 12px; line-height: 18px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
    padding-left: 12px;
  }
  .msg.open .msg-body { max-height: 45vh; overflow-y: auto; padding-bottom: 8px; }
  .msg-body::-webkit-scrollbar { width: 3px; }
  .msg-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); }

  #foot {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 16px; margin-top: 6px; color: var(--muted);
  }
  #foot button {
    border: none; background: transparent; color: var(--muted);
    font-size: 12px; padding: 0; line-height: 1;
  }


  /* 上下文用量：底部一行概览，点开是参考 dsh 的卡片（分段条 + 三段明细） */
  #usage {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 4px 2px 0; color: var(--muted); font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  #usage[hidden] { display: none; }
  #usage-meter { flex: 1 1 auto; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #usage-fill { display: block; height: 100%; width: 0; background: #4c8dff; }

  /* 卡片：绝对定位浮在输入栏上方，样式对齐 dsh 的上下文弹层 */
  #usage-card {
    position: absolute; left: 8px; right: 8px; bottom: 46px; z-index: 5;
    background: rgba(22, 26, 34, .97);
    border: 1px solid rgba(255,255,255,.10); border-radius: 14px;
    padding: 12px 14px 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  #usage-card[hidden] { display: none; }
  .uhead { display: flex; align-items: baseline; gap: 8px; color: var(--fg); }
  .uhead span { flex: 1 1 auto; font-size: 12px; color: var(--muted); }
  .uhead b { font-size: 17px; font-weight: 600; color: var(--fg); }
  .uhead em { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ubar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin: 10px 0 12px; background: rgba(255,255,255,.08); }
  .ubar i { display: block; height: 100%; }
  .ubar .sys { background: #9aa4b2; } .ubar .tools { background: #b48cff; } .ubar .msg { background: #4c8dff; }
  .urow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; color: var(--muted); }
  .urow i { width: 9px; height: 9px; border-radius: 2px; }
  .urow i.sys { background: #9aa4b2; } .urow i.tools { background: #b48cff; } .urow i.msg { background: #4c8dff; }
  .urow span { flex: 1 1 auto; }
  .urow b { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }

  /* 附件预览：圆角缩略图 + 右上角移除，参照 dsh 的附件卡片 */
  #attach-bar { flex: 0 0 auto; display: flex; gap: 8px; padding-top: 6px; }
  #attach-bar[hidden] { display: none; }
  .thumb { position: relative; width: 54px; height: 54px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.07); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border: none;
    border-radius: 9px; background: rgba(0,0,0,.62); color: #fff; font-size: 12px;
    line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
  }

  /* 紧凑输入栏：+ 图片 / 输入 / 语音 / 发送 */
  /* 右上角 ≡ 菜单：透明度 / 区块显隐 / 缩放提示 */
  #menu {
    position: absolute; right: 8px; top: 34px; z-index: 6; width: 216px;
    background: rgba(22,26,34,.98); border: 1px solid rgba(255,255,255,.10);
    border-radius: 12px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    font-size: 12px; color: var(--muted);
  }
  #menu[hidden] { display: none; }
  #menu .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  #menu .row span { flex: 1 1 auto; }
  #menu input[type=range] { flex: 1 1 auto; accent-color: #7aa2ff; }
  #menu .sw { width: 34px; height: 18px; border-radius: 9px; background: rgba(255,255,255,.16); position: relative; flex: 0 0 auto; }
  #menu .sw.on { background: rgba(122,162,255,.9); }
  #menu .sw i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 7px; background: #fff; transition: left .12s; }
  #menu .sw.on i { left: 18px; }
  #menu .hint { font-size: 11px; color: rgba(255,255,255,.45); padding-top: 6px; line-height: 1.5; }
  #menu .sep { height: 1px; background: rgba(255,255,255,.08); margin: 6px 0; }
  body.hide-tabs #tabs { display: none !important; }
  body.hide-usage #usage { display: none !important; }
  body.hide-compose #compose, body.hide-compose #attach-bar { display: none !important; }

  #compose {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line);
  }
  #compose button {
    flex: 0 0 auto; width: 30px; height: 30px; border: none; border-radius: 15px;
    background: rgba(255,255,255,.08); color: var(--fg); font-size: 15px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #compose button.listening { background: rgba(255,107,94,.85); color: #fff; }
  #ask {
    flex: 1 1 auto; min-width: 0;
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    color: var(--fg); font-size: 12.5px; padding: 6px 10px; border-radius: 15px;
    outline: none; height: 30px;
  }
  #ask::placeholder { color: var(--muted); }
  #send { background: rgba(122,162,255,.92) !important; color: #0b1020 !important; font-weight: 700; }
  #send:disabled { opacity: .4; }
  #actions { flex: 0 0 auto; display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #actions[hidden] { display: none; }
  #hint {
    flex: 1 1 auto; font-size: 11px; color: #ffcf7a; align-self: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.act { border: none; padding: 5px 12px; font-size: 12px; font-weight: 600; color: #fff; }
  #deny { background: rgba(255, 107, 94, .18); color: var(--danger); }
  #allow { background: var(--ok); }
  /* 右下角缩放标识：仅提示，实际拖拽由原生触摸层完成 */
  #grip {
    position: absolute; right: 3px; bottom: 3px; width: 12px; height: 12px;
    pointer-events: none; opacity: .5;
    border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted);
  }
</style>
</head>
<body>
<div id="card">
  <div id="head">
    <span id="dot"></span>
    <span id="title">RCHA</span>
    <span id="count" hidden></span>
  </div>
  <div id="tabs" hidden></div>
  <div id="list"><div class="empty">等待消息…</div></div>
  <div id="usage-card" hidden>
    <div class="uhead">
      <span>上下文已用</span><b id="u-pct">0%</b><em id="u-total">-</em>
    </div>
    <div class="ubar"><i class="sys" id="ub-sys"></i><i class="tools" id="ub-tools"></i><i class="msg" id="ub-msg"></i></div>
    <div class="urow"><i class="sys"></i><span>系统提示词</span><b id="u-sys">-</b></div>
    <div class="urow"><i class="tools"></i><span>工具定义</span><b id="u-tools">-</b></div>
    <div class="urow"><i class="msg"></i><span>对话消息</span><b id="u-msg">-</b></div>
  </div>
  <div id="usage" hidden>
    <span id="usage-text">上下文 0%</span>
    <span id="usage-meter"><span id="usage-fill"></span></span>
  </div>
  <div id="menu" hidden>
    <div class="row"><span>透明度</span><b id="m-alpha-v" style="min-width:32px;text-align:right;color:var(--fg)">60%</b></div>
    <div class="row"><input id="m-alpha" type="range" min="20" max="100" step="5" value="60"></div>
    <div class="sep"></div>
    <div class="row"><span>会话标签</span><div class="sw on" id="sw-tabs"><i></i></div></div>
    <div class="row"><span>上下文用量</span><div class="sw on" id="sw-usage"><i></i></div></div>
    <div class="row"><span>输入栏</span><div class="sw on" id="sw-compose"><i></i></div></div>
    <div class="hint">拖右下角或右侧/下边缘可改宽高；≡ 再点一次收起。</div>
  </div>
  <div id="attach-bar" hidden>
    <div class="thumb"><img id="thumb-img" alt=""><button id="thumb-x">×</button></div>
  </div>
  <div id="compose">
    <button id="pick" title="图片">+</button>
    <input id="ask" type="text" placeholder="问点什么…" autocomplete="off" />
    <button id="mic" title="语音">🎙</button>
    <button id="send" title="发送">↑</button>
  </div>
  <div id="actions" hidden>
    <span id="hint"></span>
    <button class="act" id="deny">拒绝</button>
    <button class="act" id="allow">允许</button>
  </div>
  <div id="foot">
    <button id="open">打开</button>
    <button id="close">关闭</button>
  </div>
  <div id="grip"></div>
</div>
<script>
(function () {
  const post = (method, params) => {
    try { DshaFloat.postMessage(JSON.stringify({ method, params: params || {} })); } catch (_) {}
  };
  const el = id => document.getElementById(id);
  let state = { tasks: [], active: '' };
  let signature = '';
  let openId = '';
  let busy = false;

  function activeTask() {
    if (!state.tasks.length) return null;
    return state.tasks.find(t => t.id === state.active) || state.tasks[0];
  }

  function syncBusy(nextBusy) {
    if (nextBusy === busy) return;
    busy = nextBusy;
    post('busy', { value: busy });
  }

  let pendingImage = '';

  function shortK(n) {
    if (!Number.isFinite(n)) return '?';
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }

  function renderUsage(usage) {
    const line = el('usage');
    if (!usage || !Number.isFinite(usage.used) || !Number.isFinite(usage.window) || usage.window <= 0) {
      line.hidden = true;
      el('usage-card').hidden = true;
      return;
    }
    const pct = Math.min(100, Math.round((usage.used / usage.window) * 100));
    el('usage-text').textContent = '上下文 ' + pct + '% · ' + shortK(usage.used) + '/' + shortK(usage.window);
    el('usage-fill').style.width = pct + '%';
    el('u-pct').textContent = pct + '%';
    el('u-total').textContent = '~' + shortK(usage.used) + ' / ' + shortK(usage.window);
    const total = Math.max(1, (usage.system || 0) + (usage.tools || 0) + (usage.messages || 0));
    el('ub-sys').style.width = ((usage.system || 0) / total * 100) + '%';
    el('ub-tools').style.width = ((usage.tools || 0) / total * 100) + '%';
    el('ub-msg').style.width = ((usage.messages || 0) / total * 100) + '%';
    el('u-sys').textContent = '~' + shortK(usage.system);
    el('u-tools').textContent = '~' + shortK(usage.tools);
    el('u-msg').textContent = '~' + shortK(usage.messages);
    line.hidden = false;
  }

  const blocks = { tabs: 'hide-tabs', usage: 'hide-usage', compose: 'hide-compose' };
  try {
    const saved = JSON.parse(localStorage.getItem('floatwin_blocks') || '{}');
    Object.keys(blocks).forEach(k => {
      if (saved[k] === false) document.body.classList.add(blocks[k]);
    });
  } catch (_) {}

  function syncSwitches() {
    Object.keys(blocks).forEach(k => {
      const on = !document.body.classList.contains(blocks[k]);
      const sw = el('sw-' + k);
      if (sw) sw.classList.toggle('on', on);
    });
  }

  window.dshFloat = {
    /** 内置能力调用：hidden 是逗号分隔的区块名（tabs/usage/compose），空串表示全部显示。 */
    applyConfig: function (hidden) {
      const names = String(hidden || '').split(',').map(x => x.trim()).filter(Boolean);
      Object.keys(blocks).forEach(k => {
        document.body.classList.toggle(blocks[k], names.includes(k));
      });
      try { localStorage.setItem('floatwin_blocks', JSON.stringify({})); } catch (_) {}
      syncSwitches();
      post('resize', {});
    },
    toggleMenu: function () {
      const menu = el('menu');
      menu.hidden = !menu.hidden;
      if (!menu.hidden) syncSwitches();
    },
    toggle: function () {
      // 轻点拖动条：展开/收起最新一条消息
      const msgs = document.querySelectorAll('#list .msg');
      if (!msgs.length) return;
      const last = msgs[msgs.length - 1];
      last.classList.toggle('open');
      openId = last.classList.contains('open') ? last.dataset.id : '';
      post('activity', {});
      post('resize', {});
    },
    onVoice: function (text) {
      const box = el('ask');
      if (!text) return;
      box.value = (box.value ? box.value + ' ' : '') + text;
      el('mic').classList.remove('listening');
      post('focus', { value: true });
      box.focus();
    },
    onVoiceState: function (state) {
      el('mic').classList.toggle('listening', state === 'listening');
    },
    onVoiceError: function (message) {
      el('mic').classList.remove('listening');
      el('ask').placeholder = message || '没听清，再说一次';
      setTimeout(() => { el('ask').placeholder = '问点什么…'; }, 2600);
    },
    onImage: function (path, dataUrl) {
      pendingImage = path || '';
      if (pendingImage) {
        el('thumb-img').src = dataUrl || '';
        el('attach-bar').hidden = false;
        el('ask').placeholder = '图片已就绪，发送即带上';
      } else {
        el('attach-bar').hidden = true;
        el('thumb-img').removeAttribute('src');
        el('ask').placeholder = '问点什么…';
      }
      post('focus', { value: true });
    },
    onData: function (json) {
      let d = json;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
      render(d || {});
    }
  };

  let frame = 0, next = null;
  function render(data) {
    next = data || {};
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const v = next || {};
      if (typeof v.alpha === 'number') {
        document.documentElement.style.setProperty('--alpha', String(Math.max(0.2, Math.min(1, v.alpha / 100))));
      }
      if (!Array.isArray(v.tasks) || !v.tasks.length) {
        el('list').innerHTML = '<div class="empty">等待消息…</div>';
        el('tabs').hidden = true;
        el('title').textContent = 'RCHA';
        el('count').hidden = true;
        return;
      }
      state = { tasks: v.tasks.slice(0, 8), active: v.active || v.tasks[0].id };
      syncBusy(state.tasks.some(t => !t.done));

      const task = activeTask();
      if (!task) return;
      el('title').textContent = task.title || 'RCHA';
      renderUsage(task.usage);
      const count = state.tasks.length;
      el('count').textContent = count > 1 ? count + ' 个任务' : '';
      el('count').hidden = count <= 1;

      // 标签只按会话集合重建
      const tabSig = state.tasks.map(t => t.id).join('|') + '#' + state.active;
      if (tabSig !== signature) {
        signature = tabSig;
        const tabs = el('tabs');
        tabs.textContent = '';
        tabs.hidden = count <= 1;
        for (const t of state.tasks) {
          const b = document.createElement('button');
          b.className = 'tab' + (t.id === state.active ? ' active' : '');
          b.textContent = t.title || t.id.slice(-4);
          b.addEventListener('click', e => {
            e.stopPropagation();
            state.active = t.id;
            signature = '';
            openId = '';
            render(state);
            post('activity', {});
          });
          tabs.appendChild(b);
        }
      }

      // 消息列表：按 id 集合重建，展开状态保留
      const msgs = Array.isArray(task.messages) ? task.messages : [];
      const listSig = task.id + '#' + msgs.map(m => (m.at || 0) + (m.title || '')).join('|');
      const list = el('list');
      if (listSig !== list.dataset.sig) {
        list.dataset.sig = listSig;
        list.textContent = '';
        if (!msgs.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '等待消息…';
          list.appendChild(empty);
        }
        msgs.forEach((m, i) => {
          const item = document.createElement('div');
          item.className = 'msg ' + (m.kind === 'tool' ? 'tool' : 'assistant');
          item.dataset.id = task.id + ':' + i;
          if (item.dataset.id === openId) item.classList.add('open');

          const head = document.createElement('div');
          head.className = 'msg-head';
          const badge = document.createElement('span');
          badge.className = 'badge';
          const title = document.createElement('span');
          title.className = 'msg-title';
          title.textContent = m.title || (m.kind === 'tool' ? '工具调用' : '回复');
          head.append(badge, title);

          const body = document.createElement('div');
          body.className = 'msg-body';
          body.textContent = m.text || '';

          head.addEventListener('click', e => {
            e.stopPropagation();
            const wasOpen = item.classList.contains('open');
            document.querySelectorAll('#list .msg.open').forEach(n => n.classList.remove('open'));
            if (!wasOpen) {
              item.classList.add('open');
              openId = item.dataset.id;
            } else {
              openId = '';
            }
            post('activity', {});
            post('resize', {});
          });

          item.append(head, body);
          list.appendChild(item);
        });
        list.scrollTop = list.scrollHeight;
      }

      const confirm = v.confirm;
      if (confirm && confirm.hint) {
        el('hint').textContent = confirm.hint;
        el('actions').hidden = false;
      } else el('actions').hidden = true;

      post('resize', {});
    });
  }

  const ask = el('ask');
  ask.addEventListener('focus', () => { post('focus', { value: true }); });
  ask.addEventListener('blur', () => { post('focus', { value: false }); });

  function sendText() {
    const typed = (ask.value || '').trim();
    const image = pendingImage;
    if (!typed && !image) return;
    const text = typed;
    pendingImage = '';
    el('attach-bar').hidden = true;
    el('thumb-img').removeAttribute('src');
    el('ask').placeholder = '问点什么…';
    const task = activeTask();
    ask.value = '';
    ask.blur();
    post('focus', { value: false });
    post('send', { text, image, session: task ? task.id : '' });
    // 本地回显，等下一次真实数据到达时整块重绘
    const list = el('list');
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();
    const item = document.createElement('div');
    item.className = 'msg assistant';
    item.dataset.id = 'local:' + Date.now();
    const head = document.createElement('div');
    head.className = 'msg-head';
    const badge = document.createElement('span');
    badge.className = 'badge';
    const title = document.createElement('span');
    title.className = 'msg-title';
    title.textContent = '我：' + text;
    head.append(badge, title);
    item.appendChild(head);
    list.appendChild(item);
    list.scrollTop = list.scrollHeight;
  }
  el('send').addEventListener('click', e => { e.stopPropagation(); sendText(); });
  el('mic').addEventListener('click', e => {
    e.stopPropagation();
    el('ask').classList.remove('listening');
    post('voice', {});
  });
  el('pick').addEventListener('click', e => { e.stopPropagation(); post('pickImage', {}); });
  Object.keys(blocks).forEach(k => {
    el('sw-' + k).addEventListener('click', e => {
      e.stopPropagation();
      const cls = blocks[k];
      const show = document.body.classList.contains(cls);
      document.body.classList.toggle(cls, !show);
      try {
        const saved = JSON.parse(localStorage.getItem('floatwin_blocks') || '{}');
        saved[k] = show;
        localStorage.setItem('floatwin_blocks', JSON.stringify(saved));
      } catch (_) {}
      syncSwitches();
      post('resize', {});
    });
  });
  el('m-alpha').addEventListener('input', e => {
    const value = Number(e.target.value) || 60;
    el('m-alpha-v').textContent = value + '%';
    post('alpha', { value });
  });
  el('usage').addEventListener('click', e => {
    e.stopPropagation();
    const card = el('usage-card');
    card.hidden = !card.hidden;
  });
  el('thumb-x').addEventListener('click', e => {
    e.stopPropagation();
    pendingImage = '';
    el('attach-bar').hidden = true;
    el('thumb-img').removeAttribute('src');
    el('ask').placeholder = '问点什么…';
  });
  ask.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendText(); }
  });

  el('open').addEventListener('click', e => { e.stopPropagation(); post('open', {}); });
  el('close').addEventListener('click', e => { e.stopPropagation(); post('dismiss', {}); });
  el('allow').addEventListener('click', () => { post('activity', {}); post('confirm', { allow: true }); });
  el('deny').addEventListener('click', () => { post('activity', {}); post('confirm', { allow: false }); });

  post('ready', {});
})();
</script>
</body>
</html>
