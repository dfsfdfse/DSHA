<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCHA</title>
<style>
  :root {
    --bg-rgb: 17, 20, 26;
    --alpha: .6;
    --fg: #f2f4f8;
    --muted: rgba(242, 244, 248, .55);
    --line: rgba(255, 255, 255, .09);
    --accent: #7aa2ff;
    --danger: #ff6b5e;
    --ok: #46c37b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font: 13px/1.5 -apple-system, "system-ui", "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #card {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(var(--bg-rgb), var(--alpha));
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 8px 12px 8px;
    overflow: hidden;
  }
  /* 唯一的拖动区：与原生触摸带等高 */
  #head {
    height: 22px;
    display: flex; align-items: center; gap: 6px;
    overflow: hidden;
  }
  #dot { width: 6px; height: 6px; background: var(--accent); flex: 0 0 auto; }
  #title {
    font-size: 11.5px; color: var(--muted); flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #count {
    font-size: 10px; color: var(--muted); flex: 0 0 auto;
    border-left: 1px solid var(--line); padding-left: 6px;
  }
  #count[hidden] { display: none; }

  #tabs {
    display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
    margin: 4px 0 6px; padding-bottom: 2px; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs[hidden] { display: none; }
  .tab {
    flex: 0 0 auto; max-width: 140px;
    font-size: 11px; line-height: 16px; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active { color: #cfe0ff; border-color: rgba(122,162,255,.65); background: rgba(122,162,255,.16); }

  /* 消息列表：填满剩余高度并滚动，样式对齐聊天记录 */
  #list {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    border-top: 1px solid var(--line); margin-top: 2px;
  }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); }
  #list::-webkit-scrollbar-track { background: transparent; }
  .empty { color: var(--muted); font-size: 12px; padding: 10px 0; }

  .msg { border-bottom: 1px solid rgba(255,255,255,.05); }
  .msg:last-child { border-bottom: none; }
  .msg-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 0 7px 2px; cursor: pointer;
  }
  .badge {
    flex: 0 0 auto; width: 4px; height: 4px; margin-top: 7px;
    background: var(--accent);
  }
  .msg.tool .badge { background: #ffcf7a; }
  .msg-title {
    flex: 1 1 auto; min-width: 0;
    font-size: 12.5px; line-height: 18px; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .msg.open .msg-title { white-space: normal; }
  .msg-body {
    max-height: 0; overflow: hidden; transition: max-height .16s ease;
    font-size: 12px; line-height: 18px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
    padding-left: 12px;
  }
  .msg.open .msg-body { max-height: 45vh; overflow-y: auto; padding-bottom: 8px; }
  .msg-body::-webkit-scrollbar { width: 3px; }
  .msg-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); }

  #foot {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 16px; margin-top: 6px; color: var(--muted);
  }
  #foot button {
    border: none; background: transparent; color: var(--muted);
    font-size: 12px; padding: 0; line-height: 1;
  }
  /* 悬浮窗里的问答框：直接向当前会话提问 */
  #compose {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line);
  }
  #ask {
    flex: 1 1 auto; min-width: 0;
    background: rgba(255,255,255,.06); border: 1px solid var(--line);
    color: var(--fg); font-size: 12px; padding: 6px 10px; border-radius: 999px;
    outline: none;
  }
  #ask::placeholder { color: var(--muted); }
  #send {
    flex: 0 0 auto; border: none; border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    background: rgba(122,162,255,.92); color: #0b1020;
  }
  #send:disabled { opacity: .4; }
  #actions { flex: 0 0 auto; display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #actions[hidden] { display: none; }
  #hint {
    flex: 1 1 auto; font-size: 11px; color: #ffcf7a; align-self: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.act { border: none; padding: 5px 12px; font-size: 12px; font-weight: 600; color: #fff; }
  #deny { background: rgba(255, 107, 94, .18); color: var(--danger); }
  #allow { background: var(--ok); }
  /* 右下角缩放标识：仅提示，实际拖拽由原生触摸层完成 */
  #grip {
    position: absolute; right: 3px; bottom: 3px; width: 12px; height: 12px;
    pointer-events: none; opacity: .5;
    border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted);
  }
</style>
</head>
<body>
<div id="card">
  <div id="head">
    <span id="dot"></span>
    <span id="title">RCHA</span>
    <span id="count" hidden></span>
  </div>
  <div id="tabs" hidden></div>
  <div id="list"><div class="empty">等待消息…</div></div>
  <div id="compose">
    <input id="ask" type="text" placeholder="问点什么…" autocomplete="off" />
    <button id="send">发送</button>
  </div>
  <div id="actions" hidden>
    <span id="hint"></span>
    <button class="act" id="deny">拒绝</button>
    <button class="act" id="allow">允许</button>
  </div>
  <div id="foot">
    <button id="open">打开</button>
    <button id="close">关闭</button>
  </div>
  <div id="grip"></div>
</div>
<script>
(function () {
  const post = (method, params) => {
    try { DshaFloat.postMessage(JSON.stringify({ method, params: params || {} })); } catch (_) {}
  };
  const el = id => document.getElementById(id);
  let state = { tasks: [], active: '' };
  let signature = '';
  let openId = '';
  let busy = false;

  function activeTask() {
    if (!state.tasks.length) return null;
    return state.tasks.find(t => t.id === state.active) || state.tasks[0];
  }

  function syncBusy(nextBusy) {
    if (nextBusy === busy) return;
    busy = nextBusy;
    post('busy', { value: busy });
  }

  window.dshFloat = {
    toggle: function () {
      // 轻点拖动条：展开/收起最新一条消息
      const msgs = document.querySelectorAll('#list .msg');
      if (!msgs.length) return;
      const last = msgs[msgs.length - 1];
      last.classList.toggle('open');
      openId = last.classList.contains('open') ? last.dataset.id : '';
      post('activity', {});
      post('resize', {});
    },
    onData: function (json) {
      let d = json;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
      render(d || {});
    }
  };

  let frame = 0, next = null;
  function render(data) {
    next = data || {};
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const v = next || {};
      if (typeof v.alpha === 'number') {
        document.documentElement.style.setProperty('--alpha', String(Math.max(0.2, Math.min(1, v.alpha / 100))));
      }
      if (!Array.isArray(v.tasks) || !v.tasks.length) {
        el('list').innerHTML = '<div class="empty">等待消息…</div>';
        el('tabs').hidden = true;
        el('title').textContent = 'RCHA';
        el('count').hidden = true;
        return;
      }
      state = { tasks: v.tasks.slice(0, 8), active: v.active || v.tasks[0].id };
      syncBusy(state.tasks.some(t => !t.done));

      const task = activeTask();
      if (!task) return;
      el('title').textContent = task.title || 'RCHA';
      const count = state.tasks.length;
      el('count').textContent = count > 1 ? count + ' 个任务' : '';
      el('count').hidden = count <= 1;

      // 标签只按会话集合重建
      const tabSig = state.tasks.map(t => t.id).join('|') + '#' + state.active;
      if (tabSig !== signature) {
        signature = tabSig;
        const tabs = el('tabs');
        tabs.textContent = '';
        tabs.hidden = count <= 1;
        for (const t of state.tasks) {
          const b = document.createElement('button');
          b.className = 'tab' + (t.id === state.active ? ' active' : '');
          b.textContent = t.title || t.id.slice(-4);
          b.addEventListener('click', e => {
            e.stopPropagation();
            state.active = t.id;
            signature = '';
            openId = '';
            render(state);
            post('activity', {});
          });
          tabs.appendChild(b);
        }
      }

      // 消息列表：按 id 集合重建，展开状态保留
      const msgs = Array.isArray(task.messages) ? task.messages : [];
      const listSig = task.id + '#' + msgs.map(m => (m.at || 0) + (m.title || '')).join('|');
      const list = el('list');
      if (listSig !== list.dataset.sig) {
        list.dataset.sig = listSig;
        list.textContent = '';
        if (!msgs.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '等待消息…';
          list.appendChild(empty);
        }
        msgs.forEach((m, i) => {
          const item = document.createElement('div');
          item.className = 'msg ' + (m.kind === 'tool' ? 'tool' : 'assistant');
          item.dataset.id = task.id + ':' + i;
          if (item.dataset.id === openId) item.classList.add('open');

          const head = document.createElement('div');
          head.className = 'msg-head';
          const badge = document.createElement('span');
          badge.className = 'badge';
          const title = document.createElement('span');
          title.className = 'msg-title';
          title.textContent = m.title || (m.kind === 'tool' ? '工具调用' : '回复');
          head.append(badge, title);

          const body = document.createElement('div');
          body.className = 'msg-body';
          body.textContent = m.text || '';

          head.addEventListener('click', e => {
            e.stopPropagation();
            const wasOpen = item.classList.contains('open');
            document.querySelectorAll('#list .msg.open').forEach(n => n.classList.remove('open'));
            if (!wasOpen) {
              item.classList.add('open');
              openId = item.dataset.id;
            } else {
              openId = '';
            }
            post('activity', {});
            post('resize', {});
          });

          item.append(head, body);
          list.appendChild(item);
        });
        list.scrollTop = list.scrollHeight;
      }

      const confirm = v.confirm;
      if (confirm && confirm.hint) {
        el('hint').textContent = confirm.hint;
        el('actions').hidden = false;
      } else el('actions').hidden = true;

      post('resize', {});
    });
  }

  const ask = el('ask');
  ask.addEventListener('focus', () => { post('focus', { value: true }); });
  ask.addEventListener('blur', () => { post('focus', { value: false }); });

  function sendText() {
    const text = (ask.value || '').trim();
    if (!text) return;
    const task = activeTask();
    ask.value = '';
    ask.blur();
    post('focus', { value: false });
    post('send', { text, session: task ? task.id : '' });
    // 本地回显，等下一次真实数据到达时整块重绘
    const list = el('list');
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();
    const item = document.createElement('div');
    item.className = 'msg assistant';
    item.dataset.id = 'local:' + Date.now();
    const head = document.createElement('div');
    head.className = 'msg-head';
    const badge = document.createElement('span');
    badge.className = 'badge';
    const title = document.createElement('span');
    title.className = 'msg-title';
    title.textContent = '我：' + text;
    head.append(badge, title);
    item.appendChild(head);
    list.appendChild(item);
    list.scrollTop = list.scrollHeight;
  }
  el('send').addEventListener('click', e => { e.stopPropagation(); sendText(); });
  ask.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendText(); }
  });

  el('open').addEventListener('click', e => { e.stopPropagation(); post('open', {}); });
  el('close').addEventListener('click', e => { e.stopPropagation(); post('dismiss', {}); });
  el('allow').addEventListener('click', () => { post('activity', {}); post('confirm', { allow: true }); });
  el('deny').addEventListener('click', () => { post('activity', {}); post('confirm', { allow: false }); });

  post('ready', {});
})();
</script>
</body>
</html>
