<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCHA</title>
<style>
  /* 令牌数值对齐 dsh：ui-theme/src/styles/design-platform.css + base.css */
  :root {
    --bg-rgb: 255, 255, 255;
    --alpha: .97;
    --fg: rgb(15, 17, 21);            /* --dsw-alias-label-primary */
    --muted: rgb(97, 102, 107);        /* --dsw-alias-label-secondary */
    --tertiary: rgb(129, 133, 140);    /* --dsw-alias-label-tertiary */
    --caption: rgb(173, 178, 184);     /* --dsw-alias-label-caption */
    --line: rgba(0, 0, 0, .10);        /* --dsw-alias-border-l2 */
    --line-strong: rgba(0, 0, 0, .12); /* --dsw-alias-border-l3 */
    --accent: rgb(65, 118, 230);       /* --dsw-alias-button-info-fill */
    --field: #fff;                     /* --dsw-specific-input-major */
    --selector: rgb(245, 246, 247);    /* --dsw-specific-selector */
    --danger: #ff6b5e;
    --ok: #46c37b;
    --font: var(--dsh-font, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
      Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif);
    --fs-content: 14px;                /* --dsh-content-font-size */
    --lh-content: 24px;
    --fs-secondary: 13px;              /* --dsh-content-font-size-secondary */
    /* 上下文分段色：system=bluish-400 / tools=violet-400 / messages=blue-450 */
    --meter-sys: rgb(173, 178, 184);
    --meter-tools: rgb(167, 139, 250);
    --meter-msg: rgb(77, 147, 248);
  }
  body.dark {
    --bg-rgb: 22, 25, 31;
    --fg: rgb(249, 250, 251);
    --muted: rgb(207, 211, 214);
    --tertiary: rgb(173, 178, 184);
    --caption: rgb(129, 133, 140);
    --line: rgba(255, 255, 255, .12);
    --line-strong: rgba(255, 255, 255, .16);
    --accent: rgb(122, 170, 255);
    --field: rgb(44, 44, 46);
    --selector: rgb(53, 54, 56);
  }
  /* 深色只需要补那些没有 token 的地方；窗口/卡片/按钮的颜色都由变量决定 */
  body.dark .tab { background: var(--selector); }
  body.dark .thumb, body.dark .file-chip { background: var(--selector); }
  body.dark .msg-body code, body.dark .msg-body .path {
    background: rgba(255,255,255,.08); color: rgb(216,222,232);
  }
  body.dark .msg-body .url { background: rgba(111,155,255,.14); color: rgb(143,178,255); }
  body.dark #usage-card { background: var(--field); }
  body.dark .empty-state span { color: rgba(242,244,248,.45); }
  body.dark .empty-state .ico { background: rgba(111,155,255,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    /* dsh 的正文字阶：14/24，触屏输入框抬到 16px 防缩放 */
    font-family: var(--font);
    font-size: var(--fs-content);
    line-height: var(--lh-content);
    color: var(--fg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #card {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(var(--bg-rgb), var(--alpha));
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 14px 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    overflow: hidden;
  }
  /* 唯一的拖动区：与原生触摸带等高 */
  /* 头部：dsh ConversationRoot .titleRow(30) / .crumb(14/20, 4 8, radius 12) */
  #head {
    flex: 0 0 auto;
    min-height: 30px;
    display: flex; align-items: center; gap: 4px;
    overflow: hidden;
    /* 右上角有原生的 ≡ / × / ↗ 三个小按钮，标题不要钻到它们下面 */
    padding-right: 84px;
  }
  #title {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 4px 8px; border-radius: 12px;
    font-size: 14px; line-height: 20px; font-weight: 500;
    color: var(--fg);
  }
  #live, #count {
    flex: none; font-size: 12px; line-height: 18px; color: var(--tertiary);
  }
  #dot {
    flex: none; width: 4px; height: 4px; border-radius: 1px; background: var(--accent);
    margin-left: 8px;
  }
  #dot { width: 6px; height: 6px; background: var(--accent); flex: 0 0 auto; }
  body.busy #dot { animation: fw-pulse 1.3s ease-in-out infinite; }
  @keyframes fw-pulse { 0%,100% { opacity: 1 } 50% { opacity: .28 } }
  #live { flex: 0 0 auto; font-size: 10px; color: var(--accent); }
  #live[hidden] { display: none; }
  #title {
    font-size: 11.5px; color: var(--muted); flex: 0 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #count {
    font-size: 10px; color: var(--muted); flex: 0 0 auto;
    border-left: 1px solid var(--line); padding-left: 6px;
  }
  #count[hidden] { display: none; }

  #tabs {
    flex: 0 0 auto;
    display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden;
    margin: 4px 0 6px; padding-bottom: 2px; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs[hidden] { display: none; }
  .tab.live::after {
    content: ''; display: inline-block; width: 4px; height: 4px; border-radius: 2px;
    background: var(--accent); margin-left: 4px; vertical-align: 1px;
  }
  .tab {
    border-radius: 0 !important;
    flex: 0 0 auto; max-width: 140px;
    font-size: 11px; line-height: 16px; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active { color: #3f7dfb; border-color: rgba(63,125,251,.45); background: rgba(63,125,251,.10); }

  /* 消息列表：填满剩余高度并滚动，样式对齐聊天记录 */
  #list {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    border-top: 1px solid var(--line); margin-top: 2px;
  }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.24); }
  #list::-webkit-scrollbar-track { background: transparent; }
  .empty { color: var(--muted); font-size: 12px; padding: 10px 0; }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; height: 100%; min-height: 160px; color: var(--muted); text-align: center;
  }
  .empty-state b { font-size: 13px; font-weight: 500; color: var(--fg); }
  .empty-state span { font-size: 11.5px; line-height: 1.6; color: rgba(23,24,28,.45); }
  .empty-state .ico { width: 34px; height: 34px; border-radius: 6px;
    background: rgba(63,125,251,.10); display: flex; align-items: center; justify-content: center; }
  .empty-state .ico svg { width: 18px; height: 18px; stroke: var(--accent); fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .working { display: flex; align-items: center; gap: 7px; padding: 9px 2px 3px; color: var(--muted); font-size: 11.5px; }
  .working .dots { display: inline-flex; gap: 3px; }
  .working .dots i { width: 4px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .35;
    animation: fw-dot 1.1s ease-in-out infinite; }
  .working .dots i:nth-child(2) { animation-delay: .18s; }
  .working .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes fw-dot { 0%,100% { opacity: .25 } 50% { opacity: 1 } }

  .msg { border-bottom: 1px solid rgba(0,0,0,.06); }
  .msg:last-child { border-bottom: none; }
  .msg-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 0 7px 2px; cursor: pointer;
  }
  .badge {
    flex: 0 0 auto; width: 4px; height: 4px; margin-top: 7px;
    background: var(--accent);
  }
  .msg.tool .badge { background: #ffcf7a; }
  /* dsh 的提问是右对齐气泡：max-width 82%、圆角 12、selector 底 */
  .msg.user {
    margin-left: 18%; width: auto; max-width: 82%;
    background: var(--selector); border-radius: 12px;
    border-bottom: none; padding: 4px 12px 0;
  }
  .msg.user .msg-head { display: none; }
  .msg.user .msg-body { padding: 8px 0; -webkit-line-clamp: 6; }
  .msg.user .msg-title { color: var(--fg); font-weight: 500; }
  body.dark .msg.user { background: rgba(111,155,255,.10); }
  .msg-title {
    flex: 1 1 auto; min-width: 0;
    font-size: var(--fs-secondary); line-height: 18px; color: var(--fg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .msg.open .msg-title { -webkit-line-clamp: unset; display: block; }
  .msg-chev { flex: 0 0 auto; width: 12px; height: 12px; margin-top: 3px; color: var(--muted);
    transition: transform .15s ease; }
  .msg-chev svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .msg.open .msg-chev { transform: rotate(180deg); }
  .msg-time {
    flex: 0 0 auto; align-self: flex-start; margin-top: 2px;
    font-size: 12px; color: var(--caption); font-variant-numeric: tabular-nums;
  }
  /* 正文默认就显示：dsh 那边是直接读回复，不是先看一行标题再点开 */
  .msg-body {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6;
    overflow: hidden;
    font-size: var(--fs-content); line-height: var(--lh-content); color: var(--fg);
    white-space: pre-wrap; word-break: break-word;
    padding: 0 0 8px 12px;
  }
  .msg.user .msg-body { -webkit-line-clamp: 3; color: var(--fg); }
  .msg.tool .msg-body {
    -webkit-line-clamp: 2; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; line-height: 16px;
  }
  /* 回复/提问没有标题：标题元素留着当弹性占位，时间才靠右 */
  .msg.no-title .msg-title { display: block; -webkit-line-clamp: 1; min-height: 0; }
  /* 工具调用和思考：折叠时只有一行「标签 · 参数」，点开才看全文（和 dsh 一样） */
  .msg.tool .msg-body, .msg.think .msg-body { display: none; }
  .msg.tool.open .msg-body, .msg.think.open .msg-body { display: block; }
  .msg.assistant .badge { display: none; }
  .msg.no-title .msg-head { padding: 2px 0; }
  .msg.think .badge { background: #b8bec7; }
  .msg.think .msg-title { color: var(--muted); }
  .msg.think .msg-body { color: var(--muted); font-style: italic; }
  /* 一轮结束的用时行：居中、细小，不抢内容 */
  .msg.note { border-bottom: none; padding: 2px 0 6px; text-align: center; }
  .msg-note { font-size: 12px; color: var(--tertiary); }
  .msg.open .msg-body {
    display: block; -webkit-line-clamp: unset; max-height: 42vh; overflow-y: auto;
  }
  /* 正文里的 Markdown 基本样式，和 dsh 的阅读效果对齐 */
  .msg-body b { font-weight: 600; }
  .msg-body em { font-style: italic; }
  .msg-body .md-h { font-weight: 600; font-size: 14px; margin: 2px 0; }
  .msg-body ul { margin: 2px 0 2px 14px; padding: 0; }
  .msg-body li { list-style: disc; margin: 1px 0; }
  .msg-body pre {
    margin: 4px 0; padding: 8px 10px; border-radius: 8px; overflow-x: auto;
    background: var(--selector); font-size: 12px; line-height: 18px;
  }
  .msg-body pre code { background: transparent; padding: 0; font-size: 11px; }
  body.dark .msg-body pre { background: rgba(255,255,255,.06); }
  .msg-body::-webkit-scrollbar-thumb { border-radius: 2px; }
  .msg-body code, .msg-body .path, .msg-body .url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: rgba(0,0,0,.05); border-radius: 4px; padding: 1px 4px; color: #2b2f36;
  }
  .msg-body .url { color: #3f7dfb; background: rgba(63,125,251,.08); }
  .msg-body::-webkit-scrollbar { width: 3px; }
  .msg-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); }



  /* 上下文用量：底部一行概览，点开是参考 dsh 的卡片（分段条 + 三段明细） */
  /* 模型菜单：dsh ui-primitives Menu.module.css + ModelSelect.module.css
     卡片 padding 4、radius 16、min-width 240、max-height 360；行 34 高、5 7、radius 12、13px */
  #model-menu {
    position: absolute; right: 10px; left: auto; bottom: 104px; z-index: 6;
    min-width: min(240px, calc(100% - 20px)); max-width: min(320px, calc(100% - 20px));
    max-height: min(360px, 60vh); overflow-y: auto;
    padding: 4px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--field);
    box-shadow: 0 12px 30px rgba(0,0,0,.18);
  }
  #model-menu[hidden] { display: none; }
  #model-menu button {
    display: flex; align-items: center; gap: 6px;
    width: 100%; min-height: 34px; padding: 5px 7px;
    border: none; border-radius: 12px; background: transparent;
    color: var(--fg); font-family: inherit; font-size: var(--fs-secondary);
    text-align: left;
  }
  #model-menu button .mname {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #model-menu button .mcheck { flex: 0 0 14px; width: 14px; height: 14px; color: var(--fg); }
  #model-menu button.on { background: var(--selector); }
  #model-menu.tip { padding: 8px; color: var(--tertiary); font-size: 12px; line-height: 18px; }

  #usage {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 4px 2px 0; color: var(--muted); font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  #usage[hidden] { display: none; }
  #usage-meter { flex: 1 1 auto; height: 3px; background: rgba(0,0,0,.10); border-radius: 2px; overflow: hidden; }
  #usage-fill { display: block; height: 100%; width: 0; background: #4c8dff; }

  /* 卡片：绝对定位浮在输入栏上方，样式对齐 dsh 的上下文弹层 */
  /* 上下文面板：照 dsh ContextMeter.module.css（264 宽、padding 12、radius lg、12px） */
  #usage-card {
    position: absolute; left: 10px; right: auto; bottom: 104px; z-index: 5;
    box-sizing: border-box; width: min(264px, calc(100% - 20px));
    padding: 12px; border-radius: 16px;
    background: var(--field);
    border: 1px solid var(--line);
    box-shadow: 0 12px 30px rgba(0,0,0,.16);
    font-size: 12px; line-height: 18px; color: var(--fg);
  }
  #usage-card[hidden] { display: none; }
  .uhead { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .uhead span { color: var(--muted); }
  .uhead b { font-size: 14px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .uhead em { margin-left: auto; font-style: normal; color: var(--caption); font-variant-numeric: tabular-nums; }
  .ubar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 8px 0 10px;
    background: var(--selector); }
  .ubar i { display: block; height: 100%; min-width: 2px; }
  .ubar .sys, .urow i.sys { background: var(--meter-sys); }
  .ubar .tools, .urow i.tools { background: var(--meter-tools); }
  .ubar .msg, .urow i.msg { background: var(--meter-msg); }
  .urow { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--muted); }
  .urow i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .urow span { flex: 1 1 auto; }
  .urow b { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
  #u-hint { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line);
    font-size: 11px; color: #d98324; }
  #u-hint[hidden] { display: none; }
  #usage-card.warn .ubar .msg { background: #ffcf7a; }
  #usage-card.danger .uhead b { color: #ff6b5e; }
  #usage-card.danger .ubar i { background: #ff6b5e; }

  /* 输入栏下方的 dock：ring 用量 + 会话统计（dsh InputBar .dock + ContextMeter） */
  #dock {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 4px 2px 0;
  }
  #meter {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    padding: 1px 8px; border: none; border-radius: 8px; background: transparent;
    color: var(--tertiary); font-family: inherit; font-size: var(--fs-secondary);
    font-variant-numeric: tabular-nums;
  }
  #meter[hidden] { display: none; }
  #meter[aria-expanded='true'] { background: var(--selector); color: var(--muted); }
  #stats {
    flex: 1 1 auto; display: flex; gap: 10px; justify-content: flex-end;
    font-size: 12px; color: var(--tertiary); font-variant-numeric: tabular-nums;
  }
  #stats[hidden] { display: none; }

  /* ≡ 菜单的三个区块开关（宿主也会用 applyConfig 下发同样的类名） */
  body.hide-tabs #tabs { display: none !important; }
  body.hide-usage #usage-card, body.hide-usage #stats { display: none !important; }
  body.hide-compose #compose { display: none !important; }

  /* 附件预览：圆角缩略图 + 右上角移除，参照 dsh 的附件卡片 */
  #attach-bar { flex: 0 0 auto; display: flex; gap: 8px; padding-top: 6px; }
  #attach-bar[hidden] { display: none; }
  .thumb { position: relative; width: 52px; height: 52px; border-radius: 4px; overflow: hidden;
    background: #eef0f3; border: 1px solid rgba(0,0,0,.06); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb img:not([src]), .thumb img[src=""] { display: none; }
  .thumb.empty::after {
    content: ''; position: absolute; inset: 14px; border: 2px solid #b8bec7; border-radius: 3px;
    background: linear-gradient(135deg, transparent 55%, #b8bec7 55% 62%, transparent 62%);
  }
  .file-chip { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px;
    border-radius: 4px; background: #f1f3f5; border: 1px solid rgba(0,0,0,.06); max-width: 100%; }
  .file-chip span { font-size: 11.5px; color: var(--fg); max-width: 150px; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .file-chip button { border: none; background: transparent; color: var(--muted); font-size: 13px; padding: 0 2px; }
  .thumb button {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border: none;
    border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px;
    line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
  }


  @media (max-width: 330px) {
    .uhead span { font-size: 13px; }
    .uhead b { font-size: 15px; }
    .urow { font-size: 10.5px; }
    #compose { padding: 10px 12px 8px; }
    #compose .row { gap: 8px; }
    .round { width: 28px; height: 28px; }
  }

  /* 输入栏：照 dsh InputBar（ui-conversation/src/client/skeleton/InputBar.module.css）
     card: padding-top 8 + gap 12；row: gap 12(窄卡 8)、padding 2px 8px 6px */
  #compose {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px;
    margin-top: 8px; padding: 8px 0 0;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: var(--fs-content);
    line-height: var(--lh-content);
  }
  #compose .row {
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px 6px;
  }
  .round svg, #model svg { stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  /* add 圆钮：28×28、selector 底、14px 图标（InputBar .add） */
  .round {
    flex: 0 0 auto; width: 28px; height: 28px; border: none; border-radius: 999px;
    background: var(--selector); color: var(--fg);
    display: grid; place-items: center; padding: 0;
  }
  .round.flat { background: transparent; color: var(--muted); }
  .round svg { width: 16px; height: 16px; display: block; }
  #pick svg { width: 14px; height: 14px; }
  #pick svg path { stroke-width: 1.3; }   /* ICON_MEDIUM_STROKE */
  #mic svg path, #mic svg rect { stroke-width: 1.3; }
  #attach svg path { stroke-width: 1.3; }
  /* send 圆钮：34×34、button-info-fill、16px 实心箭头（InputBar .primary） */
  #send {
    width: 34px; height: 34px; border: none; border-radius: 999px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center; padding: 0; flex: 0 0 auto;
  }
  #send svg { width: 16px; height: 16px; display: block; }
  #ring { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 12px;
    border: 2px solid var(--line-strong); border-left-color: var(--accent); }
  #ring[hidden] { display: none; }
  body.busy #send svg { display: none; }
  /* 停止：16 viewBox 里 10×10、rx 3（InputBar primaryStops 的矩形） */
  body.busy #send::after { content: ''; display: block; width: 10px; height: 10px;
    border-radius: 3px; background: currentColor; }
  #ask {
    width: 100%; min-height: 36px; max-height: 88px; resize: none; overflow-y: auto;
    background: transparent; border: none; outline: none;
    color: var(--fg);
    /* 触屏用 16px，避免 WebView 聚焦时自动缩放（InputBar 的 pointer:coarse 规则） */
    font-size: 16px; line-height: var(--lh-content);
    padding: 4px 8px 0 14px;
    font-family: inherit;
  }
  #ask::placeholder { color: #9aa0a6; }
  #ask::placeholder { color: var(--muted); }
  #model {
    flex: 0 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 4px;
    height: 28px; padding: 0 4px 0 8px; border: none; border-radius: 8px;
    background: transparent; color: var(--muted); font-size: var(--fs-secondary);
    font-family: inherit;
  }
  #model .name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 132px;
  }
  #model svg.chev { width: 12px; height: 12px; color: var(--caption); }
  #compose .sep { width: 1px; height: 18px; background: rgba(255,255,255,.10); flex: 0 0 auto; }

  #send:disabled { opacity: .4; }
  /* 操作提示条：发送失败 / 没会话 / 正在唤起时把原因写出来，不能点了没反应 */
  #notice {
    flex: 0 0 auto; margin: 0 10px 6px; padding: 5px 8px;
    font-size: 11.5px; line-height: 16px; border-radius: 6px;
    background: rgba(255, 107, 94, .13); color: var(--danger);
  }
  #notice[hidden] { display: none; }
  #notice.ok { background: rgba(63, 125, 251, .12); color: #3f7dfb; }
  /* 底栏统计：N 轮 M 步 ｜ 累计用量 · 缓存命中（对齐 dsh 的 stats 那行） */
  #stats {
    flex: 0 0 auto; display: flex; gap: 10px; justify-content: space-between;
    padding: 6px 2px 0; font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #stats[hidden] { display: none; }

  /* ≡ 菜单的三个区块开关（宿主也会用 applyConfig 下发同样的类名） */
  body.hide-tabs #tabs { display: none !important; }
  body.hide-usage #usage-card, body.hide-usage #stats { display: none !important; }
  body.hide-compose #compose { display: none !important; }
  #actions { flex: 0 0 auto; display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #actions[hidden] { display: none; }
  #hint {
    flex: 1 1 auto; font-size: 11px; color: #ffcf7a; align-self: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.act { border: none; padding: 5px 12px; font-size: 12px; font-weight: 600; color: #fff; }
  #deny { background: rgba(255, 107, 94, .18); color: var(--danger); }
  #allow { background: var(--ok); }
  /* 右下角缩放标识：仅提示，实际拖拽由原生触摸层完成 */
  #grip {
    position: absolute; right: 3px; bottom: 3px; width: 12px; height: 12px;
    pointer-events: none; opacity: .5;
    border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted);
  }
</style>
</head>
<body>
<div id="card">
  <div id="head">
    <span id="dot"></span>
    <span id="title">RCHA</span>
    <span id="live" hidden>进行中</span>
    <span id="count" hidden></span>
  </div>
  <div id="tabs" hidden></div>
  <div id="list"><div class="empty">等待消息…</div></div>
  <div id="usage-card" hidden>
    <div class="uhead">
      <span>上下文已用</span><b id="u-pct">0%</b><em id="u-total">-</em>
    </div>
    <div class="ubar"><i class="sys" id="ub-sys"></i><i class="tools" id="ub-tools"></i><i class="msg" id="ub-msg"></i></div>
    <div class="urow"><i class="sys"></i><span>系统提示词</span><b id="u-sys">-</b></div>
    <div class="urow"><i class="tools"></i><span>工具定义</span><b id="u-tools">-</b></div>
    <div class="urow"><i class="msg"></i><span>对话消息</span><b id="u-msg">-</b></div>
    <div id="u-hint" hidden>上下文接近上限，建议新建会话或压缩后再继续。</div>
  </div>

  <div id="menu" hidden>
    <div class="row"><span>透明度</span><b id="m-alpha-v" style="min-width:32px;text-align:right;color:var(--fg)">92%</b></div>
    <div class="row"><input id="m-alpha" type="range" min="55" max="100" step="1" value="92"></div>
    <div class="sep"></div>
    <div class="row"><span>会话标签</span><div class="sw on" id="sw-tabs"><i></i></div></div>
    <div class="row"><span>上下文用量</span><div class="sw on" id="sw-usage"><i></i></div></div>
    <div class="row"><span>输入栏</span><div class="sw on" id="sw-compose"><i></i></div></div>
    <div class="hint">拖右下角或右侧/下边缘可改宽高；≡ 再点一次收起。</div>
  </div>
  <div id="model-menu" hidden></div>
  <div id="notice" hidden></div>
  <div id="attach-bar" hidden>
    <div class="thumb" id="thumb"><img id="thumb-img" alt=""><button id="thumb-x">×</button></div>
    <div class="file-chip" id="file-chip" hidden><span id="file-name"></span><button id="file-x">×</button></div>
  </div>
  <div id="compose">
    <textarea id="ask" rows="1" placeholder="发消息或创建任务, / 调用指令, @ 文件或对话" autocomplete="off"></textarea>
    <div class="row">
      <button class="round" id="pick" title="添加文件或调用指令" aria-label="添加文件或调用指令">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 2V14"/><path d="M2 8H14"/></svg>
      </button>
      <button class="round flat" id="attach" title="文件" aria-label="文件">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12.75 4.5V9.5C12.75 10.7598 12.2496 11.968 11.3588 12.8588C10.468 13.7496 9.25978 14.25 8 14.25C6.74022 14.25 5.53204 13.7496 4.64124 12.8588C3.75045 11.968 3.25 10.7598 3.25 9.5V5C3.25 4.13805 3.59241 3.3114 4.2019 2.7019C4.8114 2.09241 5.63805 1.75 6.5 1.75C7.36195 1.75 8.1886 2.09241 8.7981 2.7019C9.40759 3.3114 9.75 4.13805 9.75 5V9.5C9.75 9.96413 9.56563 10.4092 9.23744 10.7374C8.90925 11.0656 8.46413 11.25 8 11.25C7.53587 11.25 7.09075 11.0656 6.76256 10.7374C6.43437 10.4092 6.25 9.96413 6.25 9.5V5.5"/></svg>
      </button>
      <span style="flex:1 1 auto"></span>
      <button id="model" title="模型">
        <span class="name" id="model-name">模型</span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L7.29289 9.29289C7.68342 9.68342 8.31658 9.68342 8.70711 9.29289L12 6"/></svg>
      </button>
      <button class="round flat" id="mic" title="语音" aria-label="语音">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5.15" y="1.65" width="5.7" height="8.7" rx="2.85"/><path d="M2.35 8.675C3.075 11.3 5.2 13.125 8 13.125C10.8 13.125 12.925 11.3 13.65 8.675M8 13.125V15"/></svg>
      </button>
      <span id="ring" hidden></span>
      <button id="send" title="发送消息" aria-label="发送消息">
        <svg viewBox="0 0 16 16"><path d="M8.3125 0.980183C8.66767 1.0531 8.97902 1.20418 9.2627 1.43233C9.48724 1.61297 9.73029 1.85793 9.97949 2.10714L14.707 6.83468L13.293 8.24874L9 3.95577V15.0417H7V3.95577L2.70703 8.24874L1.29297 6.83468L6.02051 2.10714C6.26971 1.85793 6.51277 1.61297 6.7373 1.43233C6.97662 1.23986 7.28445 1.04402 7.6875 0.980183C7.8973 0.947006 8.1031 0.95516 8.3125 0.980183Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <div id="dock">
    <button id="meter" hidden aria-haspopup="dialog" aria-label="上下文已用 0%">
      <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden>
        <circle id="meter-track" cx="7" cy="7" r="5.5" fill="none" stroke="var(--line-strong)" stroke-width="2"/>
        <circle id="meter-fill" cx="7" cy="7" r="5.5" fill="none" stroke="var(--tertiary)" stroke-width="2" stroke-linecap="round" transform="rotate(-90 7 7)"/>
      </svg>
      <span id="meter-pct">0%</span>
    </button>
    <div id="stats" hidden>
      <span id="st-left"></span>
      <span id="st-right"></span>
    </div>
  </div>
  <div id="actions" hidden>
    <span id="hint"></span>
    <button class="act" id="deny">拒绝</button>
    <button class="act" id="allow">允许</button>
  </div>

  <div id="grip"></div>
</div>
<script>
(function () {
  const post = (method, params) => {
    try { DshaFloat.postMessage(JSON.stringify({ method, params: params || {} })); } catch (_) {}
  };
  const el = id => document.getElementById(id);

  /**
   * 统一的点按绑定。
   *
   * 悬浮窗里出现过「按钮点不动、但输入框能打字」：原生命中按钮时输入框先失焦，
   * 失焦会改窗口 flags，updateViewLayout 把还在按着的手势判成取消，
   * 手指抬起后的 click 就不再派发。这里在 pointerup 上先触发一次，click 只兜底，
   * 350ms 内去重，保证「按下去就有反应」。
   */
  function onTap(node, handler) {
    if (!node) return;
    let last = 0;
    const fire = ev => {
      const now = Date.now();
      if (now - last < 350) return;
      last = now;
      handler(ev);
    };
    node.addEventListener('pointerup', fire);
    node.addEventListener('click', fire);
  }
  let state = { tasks: [], active: '', models: [], threads: [], modelName: '' };
  /** 已经请过宿主导入历史的会话，避免重复请求。 */
  const historyAsked = new Set();
  let signature = '';
  let openId = '';
  let busy = false;
  /** 最近一次已知的会话 id：状态还没送到时也能把消息投回对的会话。 */
  let lastSession = '';

  function activeTask() {
    if (!state.tasks.length) return null;
    return state.tasks.find(t => t.id === state.active) || state.tasks[0];
  }

  let running = false;
  function syncBusy(nextBusy) {
    running = !!nextBusy;
    if (nextBusy === busy) return;
    busy = nextBusy;
    post('busy', { value: busy });
  }

  /** 输入框里有内容时按钮就是「发送」，空着时才变「停止」——
   *  否则 agent 正在干活时想再问一句，按下去会把任务停掉，看着就像「按钮点不动」。 */
  function hasContent() {
    return !!(String(el('ask').value || '').trim() || pendingImage || pendingFile);
  }

  function refreshSendMode() {
    const stop = running && !hasContent();
    document.body.classList.toggle('busy', stop);
    const btn = el('send');
    // dsh 文案：input.send='发送消息' / input.stop='停止生成'
    const label = stop ? '停止生成' : '发送消息';
    btn.title = label;
    btn.setAttribute('aria-label', label);
  }

  let noticeTimer = 0;
  function showNotice(text, ms, ok) {
    const box = el('notice');
    if (!text) {
      box.hidden = true;
      box.textContent = '';
      return;
    }
    box.textContent = text;
    box.classList.toggle('ok', !!ok);
    box.hidden = false;
    clearTimeout(noticeTimer);
    if (ms) noticeTimer = setTimeout(() => { box.hidden = true; }, ms);
    // 提示条出现会把输入栏往上顶：菜单开着就跟着挪，别压住字
    const menu = el('model-menu');
    if (menu && !menu.hidden) placeModelMenu();
  }

  /** dsh 原文：conversation.placeholder.default */
  const PLACEHOLDER = '发消息或创建任务, / 调用指令, @ 文件或对话';

  let pendingImage = '';
  let pendingFile = '';

  function escapeHtml(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /** 行内标记：反引号代码、粗体、斜体，外加 URL / 路径高亮。 */
  function inlineMarkdown(escaped) {
    return escaped
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<span class="url">$1</span>')
      .replace(/(^|[\s(])((?:\/[\w.\/-]{2,})|(?:[\w.-]+(?:\/[\w.-]+){2,}\/?))/g,
        '$1<span class="path">$2</span>');
  }

  /**
   * 正文按 dsh 那样渲染 Markdown：标题、列表、围栏代码块、行内标记。
   * 只做这些：不做表格/图片，够读就行，也避免把 HTML 注入进来。
   */
  function formatBody(text) {
    const lines = String(text == null ? '' : text).split('\n');
    let html = '';
    let fence = false;
    let list = false;
    const closeList = () => { if (list) { html += '</ul>'; list = false; } };
    for (const raw of lines) {
      if (/^\s*```/.test(raw)) {
        closeList();
        html += fence ? '</code></pre>' : '<pre><code>';
        fence = !fence;
        continue;
      }
      if (fence) { html += escapeHtml(raw) + '\n'; continue; }
      const line = escapeHtml(raw);
      const heading = /^#{1,6}\s+(.*)$/.exec(line);
      if (heading) {
        closeList();
        html += '<div class="md-h">' + inlineMarkdown(heading[1]) + '</div>';
        continue;
      }
      const item = /^\s*(?:[-*+]|\d+\.)\s+(.*)$/.exec(line);
      if (item) {
        if (!list) { html += '<ul>'; list = true; }
        html += '<li>' + inlineMarkdown(item[1]) + '</li>';
        continue;
      }
      closeList();
      html += inlineMarkdown(line) + '\n';
    }
    closeList();
    if (fence) html += '</code></pre>';
    return html;
  }

  function formatTime(at) {
    const ms = Number(at);
    if (!Number.isFinite(ms) || ms <= 0) return '';
    const d = new Date(ms);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mm;
  }

  /** 毫秒 → 「2 分 13 秒」，和 dsh 的写法一致。 */
  function fmtDuration(ms) {
    const total = Math.max(1, Math.round(Number(ms) / 1000));
    if (total < 60) return total + ' 秒';
    const m = Math.floor(total / 60);
    const sec = total % 60;
    if (m < 60) return sec ? m + ' 分 ' + sec + ' 秒' : m + ' 分';
    return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
  }

  let workingTimer = 0;
  /** 正在处理那行跟着走秒（dsh 是「深度求索中，用时 6 分 13 秒 ···」）。 */
  function startWorkingClock(label, since) {
    if (workingTimer) { clearInterval(workingTimer); workingTimer = 0; }
    if (!since) return;
    const paint = () => { label.textContent = '深度求索中，用时 ' + fmtDuration(Date.now() - since); };
    paint();
    workingTimer = setInterval(paint, 1000);
  }

  function shortK(n) {
    if (!Number.isFinite(n)) return '?';
    if (n >= 1000000) {
      const m = n / 1000000;
      return (m >= 10 ? Math.round(m) : m.toFixed(1).replace(/\.0$/, '')) + 'M';
    }
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }

  function renderUsage(usage) {
    const meter = el('meter');
    if (!usage || !Number.isFinite(usage.used) || !Number.isFinite(usage.window) || usage.window <= 0) {
      el('usage-card').hidden = true;
      if (meter) meter.hidden = true;
      return;
    }
    const pct = Math.min(100, Math.round((usage.used / usage.window) * 100));
    // dsh 的 ContextMeter：14px 圆环（r=5.5, stroke 2）+ 百分比
    if (meter) {
      meter.hidden = false;
      const circumference = 2 * Math.PI * 5.5;
      el('meter-fill').setAttribute('stroke-dasharray',
        (circumference * pct / 100).toFixed(2) + ' ' + circumference.toFixed(2));
      el('meter-pct').textContent = pct + '%';
      meter.setAttribute('aria-label', '上下文已用 ' + pct + '%');
    }
    el('u-pct').textContent = pct + '%';
    const card = el('usage-card');
    card.classList.toggle('warn', pct >= 75 && pct < 90);
    card.classList.toggle('danger', pct >= 90);
    el('u-hint').hidden = pct < 90;
    el('u-total').textContent = '~' + shortK(usage.used) + ' / ' + shortK(usage.window);
    // 和 dsh 一致：三段按「占整个上下文窗口」的比例画，剩余部分留空底色
    const win = Math.max(1, usage.window);
    el('ub-sys').style.width = ((usage.system || 0) / win * 100) + '%';
    el('ub-tools').style.width = ((usage.tools || 0) / win * 100) + '%';
    el('ub-msg').style.width = ((usage.messages || 0) / win * 100) + '%';
    el('u-sys').textContent = '~' + shortK(usage.system);
    el('u-tools').textContent = '~' + shortK(usage.tools);
    el('u-msg').textContent = '~' + shortK(usage.messages);
  }

  const blocks = { tabs: 'hide-tabs', usage: 'hide-usage', compose: 'hide-compose' };
  try {
    const saved = JSON.parse(localStorage.getItem('floatwin_blocks') || '{}');
    Object.keys(blocks).forEach(k => {
      if (saved[k] === false) document.body.classList.add(blocks[k]);
    });
  } catch (_) {}

  function syncSwitches() {
    Object.keys(blocks).forEach(k => {
      const on = !document.body.classList.contains(blocks[k]);
      const sw = el('sw-' + k);
      if (sw) sw.classList.toggle('on', on);
    });
  }

  window.dshFloat = {
    /** 内置能力调用：hidden 是逗号分隔的区块名（tabs/usage/compose），空串表示全部显示。 */
    applyConfig: function (hidden) {
      const names = String(hidden || '').split(',').map(x => x.trim()).filter(Boolean);
      Object.keys(blocks).forEach(k => {
        document.body.classList.toggle(blocks[k], names.includes(k));
      });
      try { localStorage.setItem('floatwin_blocks', JSON.stringify({})); } catch (_) {}
      syncSwitches();
      post('resize', {});
    },
    openModelMenu: function () {
      const menu = el('model-menu');
      if (buildModelMenu()) menu.hidden = false;
    },
    toggleMenu: function () {
      const menu = el('menu');
      menu.hidden = !menu.hidden;
      if (!menu.hidden) syncSwitches();
    },
    toggle: function () {
      // 轻点拖动条：展开/收起最新一条消息
      const msgs = document.querySelectorAll('#list .msg');
      if (!msgs.length) return;
      const last = msgs[msgs.length - 1];
      last.classList.toggle('open');
      openId = last.classList.contains('open') ? last.dataset.id : '';
      post('activity', {});
      post('resize', {});
    },
    onVoice: function (text) {
      const box = el('ask');
      if (!text) return;
      box.value = (box.value ? box.value + ' ' : '') + text;
      el('mic').classList.remove('listening');
      post('focus', { value: true });
      box.focus();
    },
    onVoiceState: function (state) {
      el('mic').classList.toggle('listening', state === 'listening');
    },
    onVoiceError: function (message) {
      el('mic').classList.remove('listening');
      el('ask').placeholder = message || '没听清，再说一次';
      setTimeout(() => { el('ask').placeholder = '问点什么…'; }, 2600);
    },
    onFile: function (path, name) {
      pendingFile = path || '';
      if (pendingFile) {
        el('file-name').textContent = name || '';
        el('file-chip').hidden = false;
        el('thumb').hidden = !pendingImage;
        el('attach-bar').hidden = false;
      }
      post('focus', { value: true });
      refreshSendMode();
    },
    onImage: function (path, dataUrl) {
      pendingImage = path || '';
      if (pendingImage) {
        if (dataUrl) {
          el('thumb-img').src = dataUrl;
          el('thumb-img').parentElement.classList.remove('empty');
        } else {
          el('thumb-img').removeAttribute('src');
          el('thumb-img').parentElement.classList.add('empty');
        }
        el('attach-bar').hidden = false;
        el('ask').placeholder = '图片已就绪，发送即带上';
      } else {
        el('attach-bar').hidden = true;
        el('thumb-img').removeAttribute('src');
        el('thumb-img').parentElement.classList.remove('empty');
        el('ask').placeholder = PLACEHOLDER;
      }
      post('focus', { value: true });
      refreshSendMode();
    },
    onData: function (json) {
      let d = json;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
      render(d || {});
    }
  };

  let frame = 0, next = null;
  function render(data) {
    next = data || {};
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const v = next || {};
      document.body.classList.toggle('dark', v.theme === 'dark');
      if (typeof v.alpha === 'number') {
        const pct = Math.max(55, Math.min(100, Math.round(v.alpha)));
        document.documentElement.style.setProperty('--alpha', String(pct / 100));
        const slider = el('m-alpha');
        if (slider) slider.value = String(pct);
        const label = el('m-alpha-v');
        if (label) label.textContent = pct + '%';
      }
      if (typeof v.notice === 'string' && v.notice) showNotice(v.notice, 7000);
      const threads = Array.isArray(v.threads) ? v.threads : (state.threads || []);
      state.threads = threads;
      if (!Array.isArray(v.tasks) || (!v.tasks.length && !threads.length)) {
        el('list').innerHTML =
          '<div class="empty-state">'
          + '<div class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.37091 11.2501C1.58745 9.89288 1.32067 8.29835 1.61969 6.76006C1.91872 5.22177 2.76342 3.8433 3.99826 2.87846C5.2331 1.91362 6.77494 1.42737 8.33988 1.50925C9.90482 1.59113 11.3875 2.23562 12.5149 3.32406C13.6425 4.41269 14.3387 5.87206 14.4754 7.4334C14.612 8.99474 14.18 10.5529 13.2587 11.8209C12.3375 13.0888 10.9891 13.9813 9.46194 14.3337C8.18691 14.628 6.85895 14.5294 5.64989 14.0605C5.1712 13.8748 4.76962 13.4932 4.26534 13.3967C3.67413 13.2835 2.95257 13.5598 2.03794 14.3337"/><path d="M8 5V11"/><path d="M5 8H11"/></svg></div>'
          + '<b>还没有会话</b>'
          + '<span>直接在下面输入框提问<br>会在 RCHA 里发起对话</span>'
          + '</div>';
        syncBusy(false);
        if (workingTimer) { clearInterval(workingTimer); workingTimer = 0; }
        refreshSendMode();
        el('live').hidden = true;
        el('tabs').hidden = true;
        el('title').textContent = 'RCHA';
        el('count').hidden = true;
        return;
      }
      state = {
        tasks: (v.tasks || []).slice(0, 8),
        active: v.active || (v.tasks && v.tasks[0] ? v.tasks[0].id : '') || (threads[0] ? threads[0].id : ''),
        models: Array.isArray(v.models) ? v.models : [],
        threads,
      };
      syncBusy(state.tasks.some(t => !t.done));
      renderTabs();

      const task = activeTask();
      if (!task) {
        if (state.active) showThreadStub(state.active);
        return;
      }
      if (task.id) lastSession = String(task.id);
      const modelMenu = el('model-menu');
      if (!modelMenu.hidden && state.models.length) { buildModelMenu(); placeModelMenu(); }
      el('title').textContent = task.title || 'RCHA';
      refreshSendMode();
      el('ring').hidden = !!task.done;
      el('live').hidden = !!task.done;
      renderUsage(task.usage);
      state.modelName = task.model ? String(task.model) : (state.modelName || '');
      if (task.model && el('model-name')) {
        el('model-name').textContent = String(task.model).slice(0, 18);
      }
      const st = task.stats;
      const stats = el('stats');
      const hideStats = document.body.classList.contains('hide-usage');
      if (st && !hideStats && (st.turns || st.steps || st.total)) {
        el('st-left').textContent = (st.turns || 0) + ' 轮 ' + (st.steps || 0) + ' 步';
        const parts = [];
        if (st.total) parts.push(shortK(st.total) + ' tok');
        if (st.cacheHit != null) parts.push('缓存命中 ' + st.cacheHit + '%');
        el('st-right').textContent = parts.join(' · ');
        stats.hidden = false;
      } else {
        stats.hidden = true;
      }
      const count = state.tasks.length;
      el('count').textContent = count > 1 ? count + ' 个任务' : '';
      el('count').hidden = count <= 1;

      // 消息列表：按 id 集合重建，展开状态保留
      const msgs = Array.isArray(task.messages) ? task.messages : [];
      const listSig = task.id + '#' + msgs.map(m => (m.at || 0) + (m.title || '')).join('|');
      const list = el('list');
      if (listSig !== list.dataset.sig) {
        list.dataset.sig = listSig;
        list.textContent = '';
        if (!msgs.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '等待消息…';
          list.appendChild(empty);
        }
        msgs.forEach((m, i) => {
          const kind = m.kind === 'tool' ? 'tool'
            : m.kind === 'user' ? 'user'
              : m.kind === 'think' ? 'think'
                : m.kind === 'note' ? 'note' : 'assistant';
          const item = document.createElement('div');
          item.className = 'msg ' + kind;
          item.dataset.id = task.id + ':' + i;
          if (kind === 'note') {
            item.appendChild(Object.assign(document.createElement('div'), {
              className: 'msg-note',
              textContent: m.text || m.title || '',
            }));
            list.appendChild(item);
            return;
          }
          const isLast = i === msgs.length - 1;
          // 最新一条默认展开：问完就能直接读回复，不用先点开
          if (item.dataset.id === openId || (isLast && !openId)) item.classList.add('open');
          // 回复和提问没有「标题」，正文就是内容（dsh 也是这么排的）
          if (kind === 'assistant' || kind === 'user') item.classList.add('no-title');

          const head = document.createElement('div');
          head.className = 'msg-head';
          const badge = document.createElement('span');
          badge.className = 'badge';
          const title = document.createElement('span');
          title.className = 'msg-title';
          if (kind === 'tool' || kind === 'think') {
            const base = m.title || (kind === 'think' ? '思考' : '工具调用');
            const withCount = m.count > 1 ? base + ' ×' + m.count : base;
            const first = String(m.text || '').trim().split('\n')[0];
            // dsh 是把参数直接接在标题后面一行看完的
            title.textContent = first ? withCount + ' · ' + first : withCount;
          }
          const chev = document.createElement('span');
          chev.className = 'msg-chev';
          chev.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6L7.29289 9.29289C7.68342 9.68342 8.31658 9.68342 8.70711 9.29289L12 6"/></svg>';
          const time = document.createElement('span');
          time.className = 'msg-time';
          time.textContent = formatTime(m.at);
          head.append(badge, title, time, chev);

          const body = document.createElement('div');
          body.className = 'msg-body';
          const text = String(m.text || (kind === 'user' ? m.title : '') || '');
          body.innerHTML = formatBody(text);
          if (!text.trim()) {
            body.style.display = 'none';
            chev.style.visibility = 'hidden';
          }

          onTap(head, e => {
            e.stopPropagation();
            const wasOpen = item.classList.contains('open');
            document.querySelectorAll('#list .msg.open').forEach(n => n.classList.remove('open'));
            if (!wasOpen) {
              item.classList.add('open');
              openId = item.dataset.id;
            } else {
              openId = '';
            }
            post('activity', {});
            post('resize', {});
          });

          item.append(head, body);
          list.appendChild(item);
        });
        if (!task.done) {
          const working = document.createElement('div');
          working.className = 'working';
          const dots = document.createElement('span');
          dots.className = 'dots';
          for (let i = 0; i < 3; i++) dots.appendChild(document.createElement('i'));
          const label = document.createElement('span');
          label.textContent = '深度求索中…';
          working.append(dots, label);
          list.appendChild(working);
          startWorkingClock(label, task.since);
        }
        list.scrollTop = list.scrollHeight;
        // 没被截断的行不需要展开箭头
        requestAnimationFrame(() => {
          list.querySelectorAll('.msg').forEach(node => {
            if (node.classList.contains('open')) return;
            const body = node.querySelector('.msg-body');
            const chev = node.querySelector('.msg-chev');
            if (!body || !chev || body.style.display === 'none') return;
            chev.style.visibility = body.scrollHeight > body.clientHeight + 2 ? '' : 'hidden';
          });
        });
      }

      const confirm = v.confirm;
      if (confirm && confirm.hint) {
        el('hint').textContent = confirm.hint;
        el('actions').hidden = false;
      } else el('actions').hidden = true;

      post('resize', {});
    });
  }

  const ask = el('ask');
  ask.addEventListener('focus', () => { post('focus', { value: true }); });
  ask.addEventListener('blur', () => { post('focus', { value: false }); });

  /** 标签行列出全部对话（有消息的在最前，其余按更新时间）。 */
  function renderTabs() {
    const tabs = el('tabs');
    if (!tabs) return;
    const rows = state.threads.length
      ? state.threads.map(t => ({ id: t.id, title: t.title || '', live: !!t.live }))
      : state.tasks.map(t => ({ id: t.id, title: t.title || '', live: !t.done }));
    const seen = new Set();
    const ready = rows.filter(t => (seen.has(t.id) ? false : seen.add(t.id)));
    const sig = ready.map(t => t.id + ':' + (t.title || '') + (t.live ? '!' : '')).join('|') + '#' + state.active;
    if (sig === tabs.dataset.sig) {
      tabs.hidden = ready.length <= 1;
      return;
    }
    tabs.dataset.sig = sig;
    tabs.textContent = '';
    tabs.hidden = ready.length <= 1;
    for (const t of ready.slice(0, 16)) {
      const b = document.createElement('button');
      b.className = 'tab' + (t.id === state.active ? ' active' : '') + (t.live ? ' live' : '');
      b.textContent = t.title || '会话 ' + String(t.id).slice(-4);
      onTap(b, e => {
        e.stopPropagation();
        state.active = t.id;
        tabs.dataset.sig = '';
        signature = '';
        openId = '';
        render(state);
        post('activity', {});
      });
      tabs.appendChild(b);
    }
  }

  /** 选了一个还没有消息的会话：先占位，再请宿主读一次历史。 */
  function showThreadStub(id) {
    const list = el('list');
    if (list.dataset.sig === 'thread:' + id) return;
    list.dataset.sig = 'thread:' + id;
    const row = state.threads.find(t => t.id === id);
    el('title').textContent = (row && row.title) || '会话 ' + String(id).slice(-4);
    el('live').hidden = true;
    el('tabs').hidden = state.threads.length <= 1;
    list.innerHTML = '<div class="empty">正在读取这个对话的历史…</div>';
    if (!historyAsked.has(id)) {
      historyAsked.add(id);
      post('thread', { session: id });
    }
    post('resize', {});
  }

  /** 本地回显：先把用户这句放到列表里，等真实数据到达时整块重绘。 */
  function appendEcho(text, hasAttachment) {
    const list = el('list');
    const emptyState = list.querySelector('.empty-state');
    if (emptyState) emptyState.remove();
    const item = document.createElement('div');
    item.className = 'msg user';
    const head = document.createElement('div');
    head.className = 'msg-head';
    const badge = document.createElement('span');
    badge.className = 'badge';
    const title = document.createElement('span');
    title.className = 'msg-title';
    title.textContent = text || (hasAttachment ? '（附件）' : '');
    head.append(badge, title);
    item.appendChild(head);
    list.appendChild(item);
    list.scrollTop = list.scrollHeight;
  }

  function sendText() {
    const typed = (ask.value || '').trim();
    const image = pendingImage;
    const file = pendingFile;
    if (!typed && !image && !file) return;
    const text = typed;
    const task = activeTask();
    // 状态可能还没送到（或只有旧的任务 id）：把最近一次已知的会话 id 带上，
    // 插件侧还会再按「最近活跃会话」兜底，所以空串也能投递。
    const session = (task && task.id) || state.active || lastSession || '';
    pendingImage = '';
    pendingFile = '';
    el('attach-bar').hidden = true;
    el('file-chip').hidden = true;
    el('file-name').textContent = '';
    el('thumb-img').removeAttribute('src');
    el('ask').placeholder = PLACEHOLDER;
    try { el('ask').style.height = '36px'; } catch (_) {}
    ask.value = '';
    ask.blur();
    post('focus', { value: false });
    post('send', { text, image, file, session });
    appendEcho(text, !!(image || file));
    if (!session) {
      // 完全不知道投给谁：请宿主重新读状态，并说明正在做什么
      post('refresh', {});
      post('threads', {});
      showNotice('正在唤起 RCHA 会话…', 5000, true);
    } else {
      showNotice('', 0);
    }
    refreshSendMode();
  }

  onTap(el('send'), e => {
    e.stopPropagation();
    // 有内容就发（agent 正在跑时也是一句追加提问）；空着才是停止
    if (hasContent()) {
      sendText();
      return;
    }
    const task = activeTask();
    if (task && !task.done) {
      post('cancel', { session: task.id });
      return;
    }
    post('refresh', {});
    showNotice('没有进行中的会话，请在 RCHA 里打开一个对话', 4000);
  });
  onTap(el('mic'), e => {
    e.stopPropagation();
    el('ask').classList.remove('listening');
    post('voice', {});
  });
  onTap(el('pick'), e => { e.stopPropagation(); post('pickImage', {}); });
  Object.keys(blocks).forEach(k => {
    onTap(el('sw-' + k), e => {
      e.stopPropagation();
      const cls = blocks[k];
      const show = document.body.classList.contains(cls);
      document.body.classList.toggle(cls, !show);
      try {
        const saved = JSON.parse(localStorage.getItem('floatwin_blocks') || '{}');
        saved[k] = show;
        localStorage.setItem('floatwin_blocks', JSON.stringify(saved));
      } catch (_) {}
      syncSwitches();
      post('resize', {});
    });
  });
  el('m-alpha').addEventListener('input', e => {
    const value = Math.max(55, Math.min(100, Number(e.target.value) || 92));
    el('m-alpha-v').textContent = value + '%';
    // 窗口不再整体半透明，透明全靠这张卡片自己的底色
    document.documentElement.style.setProperty('--alpha', String(value / 100));
    post('alpha', { value });
  });
  onTap(el('meter'), e => {
    e.stopPropagation();
    const card = el('usage-card');
    card.hidden = !card.hidden;
    el('meter').setAttribute('aria-expanded', card.hidden ? 'false' : 'true');
    if (!card.hidden) placeUsagePanel();
  });
  onTap(el('attach'), e => { e.stopPropagation(); post('pickFile', {}); });
  onTap(el('file-x'), e => {
    e.stopPropagation();
    pendingFile = '';
    el('file-chip').hidden = true;
    if (!pendingImage) el('attach-bar').hidden = true;
  });
  /** 上下文面板贴着 dock 上沿（dsh 的 panel 是浮层，不能压住输入栏）。 */
  function placeUsagePanel() {
    const card = el('usage-card');
    const compose = el('compose');
    const dock = el('dock');
    if (!card || !compose) return;
    const foot = dock && !dock.hidden ? dock.offsetHeight : 0;
    card.style.bottom = (compose.offsetHeight + foot + 8) + 'px';
  }

  /** 菜单贴着输入栏上沿：输入框长高了、或者下面弹出提示条，都不能压住内容。 */
  function placeModelMenu() {
    const menu = el('model-menu');
    const compose = el('compose');
    const box = el('notice');
    if (!menu || !compose) return;
    const extra = box && !box.hidden ? box.offsetHeight + 8 : 0;
    const dock = el('dock');
    const foot = dock && !dock.hidden ? dock.offsetHeight : 0;
    menu.style.bottom = (compose.offsetHeight + extra + foot + 8) + 'px';
  }

  function buildModelMenu() {
    const menu = el('model-menu');
    if (!state.models || !state.models.length) return false;
    menu.textContent = '';
    state.models.forEach(m => {
      const b = document.createElement('button');
      const name = document.createElement('span');
      name.className = 'mname';
      name.textContent = m.name || m.id;
      b.appendChild(name);
      const check = document.createElement('span');
      check.className = 'mcheck';
      const picked = m.name === state.modelName || (state.modelName && String(m.id) === String(state.modelName));
      if (picked) {
        b.className = 'on';
        check.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5L6.5 12L13 4.5"/></svg>';
      }
      b.appendChild(check);
      onTap(b, ev => {
        ev.stopPropagation();
        menu.hidden = true;
        post('model', { session: (activeTask() || {}).id || lastSession || '', provider: m.provider, model: m.id });
      });
      menu.appendChild(b);
    });
    return true;
  }

  onTap(el('model'), e => {
    e.stopPropagation();
    const menu = el('model-menu');
    if (!menu.hidden) { menu.hidden = true; return; }
    menu.classList.remove('tip');
    if (buildModelMenu()) {
      placeModelMenu();
      menu.hidden = false;
      return;
    }
    // 清单还没拿到（插件刚起来 / 服务晚挂载）：请一次，别让按钮点了没反应
    menu.textContent = '正在获取模型清单…';
    menu.classList.add('tip');
    placeModelMenu();
    menu.hidden = false;
    post('models', {});
  });

  onTap(el('thumb-x'), e => {
    e.stopPropagation();
    pendingImage = '';
    pendingFile = '';
    el('attach-bar').hidden = true;
    el('file-chip').hidden = true;
    el('file-name').textContent = '';
    el('thumb-img').removeAttribute('src');
    el('ask').placeholder = '问点什么…';
  });
  function growAsk() {
    ask.style.height = 'auto';
    ask.style.height = Math.min(84, Math.max(30, ask.scrollHeight)) + 'px';
    refreshSendMode();
  }
  ask.addEventListener('input', growAsk);

  ask.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendText(); }
  });

  document.addEventListener('click', e => {
    const card = el('usage-card');
    if (!card.hidden && !card.contains(e.target) && !e.target.closest('#meter')) {
      card.hidden = true;
      el('meter').setAttribute('aria-expanded', 'false');
    }
    const menu = el('model-menu');
    if (!menu.hidden && !menu.contains(e.target) && e.target.id !== 'model' && !e.target.closest('#model')) {
      menu.hidden = true;
    }
  });

  onTap(el('allow'), () => { post('activity', {}); post('confirm', { allow: true }); });
  onTap(el('deny'), () => { post('activity', {}); post('confirm', { allow: false }); });

  post('ready', {});
  // 宿主在页面加载前推的那一帧会丢：主动请它再读一次状态文件。
  post('refresh', {});
  // 再请一次会话清单，保证「所有对话」都能列出来
  post('threads', {});
})();
</script>
</body>
</html>
